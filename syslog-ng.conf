@version: 4.12
@include "scl.conf"

# Medium-safe defaults (compose 1 GiB). Last-wins: syslog-ng.d/zz_profile.conf.
# 4.11+: global log-iw-size() removed; mem-buf-size() ignored with reliable(no).
@define fifo_size 50000
@define disk_buf 1073741824
@define udp_rcvbuf 67108864
@define tcp_rcvbuf 16777216
@define iw_size 4000
@define tcp_iw_size 6400
@define tcp_max_conn 64

# Ingest token + generated connectors (zz_connectors.conf) live under conf.d.
@include "/etc/syslog-ng/conf.d/*.conf"

options {
    chain_hostnames(off);
    use_dns(no);
    log_fifo_size(`fifo_size`);
};

# Live/history scrape (backend + stats-collector). Не публикуем наружу.
source s_stats {
    stats-exporter-dont-log(
        ip("0.0.0.0")
        port(9577)
        stat-type("stats")
        # Default is prometheus (new input/output_events_*); our scrapers parse CSV
        # (s_<id>_udp / s_<id>_tcp) for per-connector Pipeline metrics.
        stat-format("csv")
        scrape-pattern("GET /stats*")
        scrape-freq-limit(0)
        single-instance(no)
    );
};

log { source(s_stats); };
