@version: 4.11

options {
    chain_hostnames(off);
    use_dns(no);
    log_fifo_size(2000000);
};

source s_udp {
    network(
        transport("udp")
        port(514)
        so-rcvbuf(134217728)
        flags(store-raw-message)
    );
};

source s_tcp {
    network(
        transport("tcp")
        port(514)
        so-rcvbuf(16777216)
        max-connections(256)
        flags(store-raw-message)
    );
};

# Маркер транспорта — в template() destination (на log{} template не действует).
template t_rawmsg_udp {
    template("@@nm/udp/@@${RAWMSG}\n");
    template_escape(no);
};

template t_rawmsg_tcp {
    template("@@nm/tcp/@@${RAWMSG}\n");
    template_escape(no);
};

# disk-buffer: reliable(no) + большой mem-buf — пики в RAM, диск только overflow.
# reliable(yes) на слабом CPU режет TCP drain до ~1–2k EPS (loadgen на :514 врёт «успех»).
destination d_backend_udp {
    network(
        "backend"
        port(1514)
        transport("tcp")
        template(t_rawmsg_udp)
        persist-name("ingest-udp")
        time-reopen(5)
        so-sndbuf(16777216)
        flush_lines(100)
        flush_timeout(10)
        disk-buffer(
            mem-buf-size(134217728)
            disk-buf-size(1073741824)
            dir("/var/lib/syslog-ng-buffer/udp")
            reliable(no)
        )
    );
};

destination d_backend_tcp {
    network(
        "backend"
        port(1514)
        transport("tcp")
        template(t_rawmsg_tcp)
        persist-name("ingest-tcp")
        time-reopen(5)
        so-sndbuf(16777216)
        flush_lines(100)
        flush_timeout(10)
        disk-buffer(
            mem-buf-size(134217728)
            disk-buf-size(1073741824)
            dir("/var/lib/syslog-ng-buffer/tcp")
            reliable(no)
        )
    );
};

log {
    source(s_udp);
    destination(d_backend_udp);
    flags(flow-control);
};

log {
    source(s_tcp);
    destination(d_backend_tcp);
    flags(flow-control);
};
