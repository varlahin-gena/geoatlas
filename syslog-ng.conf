@version: 4.11
@include "scl.conf"

# Medium-safe defaults (compose 1 GiB). Last-wins: syslog-ng.d/zz_profile.conf.
# 4.11: global log-iw-size() removed; mem-buf-size() ignored with reliable(no).
@define fifo_size 50000
@define disk_buf 1073741824
@define udp_rcvbuf 67108864
@define tcp_rcvbuf 16777216
@define iw_size 4000
@define tcp_iw_size 6400
@define tcp_max_conn 64

@include "/etc/syslog-ng/conf.d/*.conf"

options {
    chain_hostnames(off);
    use_dns(no);
    log_fifo_size(`fifo_size`);
};

source s_udp {
    network(
        transport("udp")
        port(514)
        so-rcvbuf(`udp_rcvbuf`)
        log-iw-size(`iw_size`)
        flags(store-raw-message)
    );
};

source s_tcp {
    network(
        transport("tcp")
        port(514)
        so-rcvbuf(`tcp_rcvbuf`)
        max-connections(`tcp_max_conn`)
        log-iw-size(`tcp_iw_size`)
        flags(store-raw-message)
    );
};

# Маркер транспорта — в template() destination (на log{} template не действует).
template t_rawmsg_udp {
    template("@@ga/udp/`ga_ingest_token`/@@${RAWMSG}\n");
    template_escape(no);
};

template t_rawmsg_tcp {
    template("@@ga/tcp/`ga_ingest_token`/@@${RAWMSG}\n");
    template_escape(no);
};

# disk-buffer reliable(no): in-memory window = flow-control-window-size (сообщения),
# диск = capacity-bytes. reliable(yes) на слабом CPU режет drain до ~1–2k EPS.
destination d_backend_udp {
    network(
        "backend"
        port(1514)
        transport("tcp")
        template(t_rawmsg_udp)
        persist-name("ingest-udp")
        time-reopen(5)
        so-sndbuf(16777216)
        flush_lines(100)
        disk-buffer(
            reliable(no)
            flow-control-window-size(`fifo_size`)
            capacity-bytes(`disk_buf`)
            dir("/var/lib/syslog-ng-buffer/udp")
        )
    );
};

destination d_backend_tcp {
    network(
        "backend"
        port(1514)
        transport("tcp")
        template(t_rawmsg_tcp)
        persist-name("ingest-tcp")
        time-reopen(5)
        so-sndbuf(16777216)
        flush_lines(100)
        disk-buffer(
            reliable(no)
            flow-control-window-size(`fifo_size`)
            capacity-bytes(`disk_buf`)
            dir("/var/lib/syslog-ng-buffer/tcp")
        )
    );
};

log {
    source(s_udp);
    destination(d_backend_udp);
    flags(flow-control);
};

log {
    source(s_tcp);
    destination(d_backend_tcp);
    flags(flow-control);
};

# Live/history scrape (backend + stats-collector). Не публикуем наружу.
source s_stats {
    stats-exporter-dont-log(
        ip("0.0.0.0")
        port(9577)
        stat-type("stats")
        stat-format("csv")
        scrape-pattern("GET /stats*")
        scrape-freq-limit(0)
        single-instance(no)
    );
};

log { source(s_stats); };
