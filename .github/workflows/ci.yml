name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# Isolate modules: a Dependabot bump that raises one go.mod language version
# must not fail chconn/stats via go.work. GOTOOLCHAIN=local keeps CI on setup-go
# 1.26.x; check-latest: true picks the current patch (stdlib advisories).
env:
  GOWORK: "off"
  GOTOOLCHAIN: local

# Drop superseded runs on the same PR or branch (Playwright, ClickHouse, fuzz, images).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.gates.outputs.backend }}
      frontend: ${{ steps.gates.outputs.frontend }}
      stats: ${{ steps.gates.outputs.stats }}
      chconn: ${{ steps.gates.outputs.chconn }}
      syslogngstats: ${{ steps.gates.outputs.syslogngstats }}
      govulncheck: ${{ steps.gates.outputs.govulncheck }}
      integration: ${{ steps.gates.outputs.integration }}
      shell: ${{ steps.gates.outputs.shell }}
      docker_any: ${{ steps.gates.outputs.docker_any }}
      docker_images: ${{ steps.gates.outputs.docker_images }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # PRs only: skip Playwright / ClickHouse / fuzz / docker when those trees did not change.
      # Push to main/develop still runs every job (gates force true below).
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'pkg/**'
              - 'openapi.yaml'
              - 'go.work'
              - 'go.work.sum'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'openapi.yaml'
              - '.github/workflows/ci.yml'
            stats:
              - 'stats-collector/**'
              - 'pkg/**'
              - '.github/workflows/ci.yml'
            chconn:
              - 'pkg/chconn/**'
              - '.github/workflows/ci.yml'
            syslogngstats:
              - 'pkg/syslogngstats/**'
              - '.github/workflows/ci.yml'
            govulncheck:
              - '**/*.go'
              - '**/go.mod'
              - '**/go.sum'
              - 'go.work'
              - 'go.work.sum'
              - 'scripts/ci-govulncheck.sh'
              - '.github/workflows/ci.yml'
            integration:
              - 'backend/**'
              - 'pkg/chconn/**'
              - 'pkg/syslogngstats/**'
              - 'docker-compose.yml'
              - 'clickhouse/**'
              - '.github/workflows/ci.yml'
            shell:
              - 'start.sh'
              - 'stop.sh'
              - 'update.sh'
              - 'scripts/**'
              - 'deploy/**'
              - 'docker-compose*.yml'
              - 'syslog-ng.conf'
              - 'syslog-ng.d/**'
              - '.github/workflows/ci.yml'
            docker_backend:
              - 'backend/Dockerfile'
              - 'backend/**'
              - 'pkg/**'
              - '.dockerignore'
              - 'scripts/ci-docker-build.sh'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'
            docker_stats:
              - 'stats-collector/Dockerfile'
              - 'stats-collector/**'
              - 'pkg/**'
              - '.dockerignore'
              - 'scripts/ci-docker-build.sh'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'
            docker_frontend:
              - 'frontend/Dockerfile'
              - 'frontend/**'
              - '.dockerignore'
              - 'scripts/ci-docker-build.sh'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'
            docker_syslog:
              - 'syslog-ng/Dockerfile'
              - 'syslog-ng/**'
              - 'scripts/ci-docker-build.sh'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'

      - name: set job gates
        id: gates
        env:
          EVENT_NAME: ${{ github.event_name }}
          BACKEND: ${{ steps.filter.outputs.backend }}
          FRONTEND: ${{ steps.filter.outputs.frontend }}
          STATS: ${{ steps.filter.outputs.stats }}
          CHCONN: ${{ steps.filter.outputs.chconn }}
          SYSLOGNGSTATS: ${{ steps.filter.outputs.syslogngstats }}
          GOVULNCHECK: ${{ steps.filter.outputs.govulncheck }}
          INTEGRATION: ${{ steps.filter.outputs.integration }}
          SHELL: ${{ steps.filter.outputs.shell }}
          DOCKER_BACKEND: ${{ steps.filter.outputs.docker_backend }}
          DOCKER_STATS: ${{ steps.filter.outputs.docker_stats }}
          DOCKER_FRONTEND: ${{ steps.filter.outputs.docker_frontend }}
          DOCKER_SYSLOG: ${{ steps.filter.outputs.docker_syslog }}
        run: |
          set -euo pipefail
          emit() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            for k in backend frontend stats chconn syslogngstats govulncheck integration shell; do
              emit "$k" true
            done
            emit docker_any true
            emit docker_images '["backend","stats-collector","frontend","syslog-ng"]'
            exit 0
          fi
          emit backend "${BACKEND:-false}"
          emit frontend "${FRONTEND:-false}"
          emit stats "${STATS:-false}"
          emit chconn "${CHCONN:-false}"
          emit syslogngstats "${SYSLOGNGSTATS:-false}"
          emit govulncheck "${GOVULNCHECK:-false}"
          emit integration "${INTEGRATION:-false}"
          emit shell "${SHELL:-false}"
          imgs=()
          [[ "${DOCKER_BACKEND:-false}" == "true" ]] && imgs+=("backend")
          [[ "${DOCKER_STATS:-false}" == "true" ]] && imgs+=("stats-collector")
          [[ "${DOCKER_FRONTEND:-false}" == "true" ]] && imgs+=("frontend")
          [[ "${DOCKER_SYSLOG:-false}" == "true" ]] && imgs+=("syslog-ng")
          if ((${#imgs[@]} == 0)); then
            # Dummy matrix: GHA still parses fromJSON when the job is skipped.
            emit docker_any false
            emit docker_images '["backend"]'
          else
            json=$(printf '"%s",' "${imgs[@]}")
            emit docker_any true
            emit docker_images "[${json%,}]"
          fi

  release-contract:
    name: release contract (VERSION / OpenAPI / CHANGELOG)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: check VERSION ↔ CHANGELOG ↔ OpenAPI
        run: bash scripts/check-release-contract.sh
      - name: check Go module identity (geoatlas / cmd/geoatlas)
        run: bash scripts/check-module-identity.sh

  shellcheck:
    name: shellcheck (deploy / start / scripts)
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shellcheck
        run: bash scripts/shellcheck.sh
      - name: pack + apply-package smoke
        run: bash scripts/test-apply-package.sh
      - name: compose stop placeholders
        run: bash scripts/test-compose-stop-env.sh

  backend:
    name: backend (test + lint)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: |
            backend/go.sum
            backend/go.mod
            pkg/chconn/go.sum
            pkg/chconn/go.mod
            pkg/syslogngstats/go.mod

      # go mod verify не умеет local replace (нет ziphash у geoatlas/pkg/chconn).
      - name: go mod download
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: coverage smoke (critical packages)
        run: |
          set -euo pipefail
          pkgs=(
            ./internal/adapter/ingestnet/
            ./internal/usecase/ingest/
            ./internal/config/
            ./internal/adapter/geojob/
            ./internal/mapagg/
            ./internal/adapter/httpapi/authmw/
            ./internal/safeurl/
            ./internal/mapsearch/
            ./internal/auth/
            ./internal/adapter/httpapi/loginthrottle/
          )
          soft_pkgs=(
            ./internal/adapter/clickhouse/trafficstore/
            ./internal/adapter/httpapi/
          )
          min_pkgs=(./internal/adapter/clickhouse/anomalystore/)
          fail=0
          for pkg in "${pkgs[@]}"; do
            line=$(go test -count=1 -cover "$pkg" 2>&1 | tee /dev/stderr | tail -n1)
            # ok   geoatlas/internal/adapter/ingestnet  0.123s  coverage: 67.8% of statements
            pct=$(echo "$line" | sed -n 's/.*coverage: \([0-9.]*\)% of statements.*/\1/p')
            if [[ -z "$pct" ]]; then
              echo "ERROR: no coverage for $pkg ($line)" >&2
              fail=1
              continue
            fi
            # Soft floor — ловим регресс «тесты пропали», не гонимся за 100%.
            awk -v p="$pct" -v pkg="$pkg" 'BEGIN { if (p+0 < 40) { printf "ERROR: %s coverage %.1f%% < 40%%\n", pkg, p; exit 1 } }' \
              || fail=1
          done
          for pkg in "${soft_pkgs[@]}"; do
            line=$(go test -count=1 -cover "$pkg" 2>&1 | tee /dev/stderr | tail -n1)
            pct=$(echo "$line" | sed -n 's/.*coverage: \([0-9.]*\)% of statements.*/\1/p')
            if [[ -z "$pct" ]]; then
              echo "ERROR: no coverage for $pkg ($line)" >&2
              fail=1
              continue
            fi
            # trafficstore / httpapi / anomalystore: soft floor 20% — ловим обнуление.
            awk -v p="$pct" -v pkg="$pkg" 'BEGIN { if (p+0 < 20) { printf "ERROR: %s coverage %.1f%% < 20%%\n", pkg, p; exit 1 } }' \
              || fail=1
          done
          for pkg in "${min_pkgs[@]}"; do
            line=$(go test -count=1 -cover "$pkg" 2>&1 | tee /dev/stderr | tail -n1)
            pct=$(echo "$line" | sed -n 's/.*coverage: \([0-9.]*\)% of statements.*/\1/p')
            if [[ -z "$pct" ]]; then
              echo "ERROR: no coverage for $pkg ($line)" >&2
              fail=1
              continue
            fi
            # anomalystore: CH-heavy; unit tests cover guards/SQL helpers only.
            awk -v p="$pct" -v pkg="$pkg" 'BEGIN { if (p+0 < 10) { printf "ERROR: %s coverage %.1f%% < 10%%\n", pkg, p; exit 1 } }' \
              || fail=1
          done
          exit "$fail"

      - name: go fuzz (smoke)
        # Count-based budget: wall-clock -fuzztime=Ns can FAIL with
        # "context deadline exceeded" when the coordinator timer fires
        # (golang/go#75804). These targets do not use context.
        run: |
          go test ./internal/parser/ -run=^$ -fuzz=FuzzParseVerbose -fuzztime=200000x
          go test ./internal/adapter/ingestnet/ -run=^$ -fuzz=FuzzFrameReader -fuzztime=200000x

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          working-directory: backend
          args: --timeout=5m

  chconn:
    name: pkg/chconn (test)
    needs: changes
    if: needs.changes.outputs.chconn == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pkg/chconn
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: |
            pkg/chconn/go.sum
            pkg/chconn/go.mod

      - name: go test
        run: go test -race -count=1 ./...

  syslogngstats:
    name: pkg/syslogngstats (test)
    needs: changes
    if: needs.changes.outputs.syslogngstats == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pkg/syslogngstats
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: pkg/syslogngstats/go.mod

      - name: go test
        run: go test -race -count=1 ./...

  backend-integration:
    name: backend (clickhouse integration)
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.8.33.6
        ports:
          - 9000:9000
          - 8123:8123
        env:
          # CH 25+ без USER/PASSWORD режет network access для default;
          # /ping с хоста всё равно отвечает, а native :9000 падает с auth failed.
          CLICKHOUSE_DB: default
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: ci_test
        options: >-
          --health-cmd "wget -qO- 'http://localhost:8123/?user=default&password=ci_test&query=SELECT%201' || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --ulimit nofile=262144:262144
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: |
            backend/go.sum
            backend/go.mod
            pkg/chconn/go.sum
            pkg/chconn/go.mod
            pkg/syslogngstats/go.mod

      - name: Wait for ClickHouse
        env:
          CLICKHOUSE_PASSWORD: ci_test
        run: |
          for i in $(seq 1 60); do
            if curl -fsS -G "http://127.0.0.1:8123/" \
              --data-urlencode "user=default" \
              --data-urlencode "password=${CLICKHOUSE_PASSWORD}" \
              --data-urlencode "query=SELECT 1" >/dev/null 2>&1; then
              echo "ClickHouse authenticated HTTP ready"
              exit 0
            fi
            sleep 2
          done
          echo "ClickHouse not ready for authenticated queries"
          exit 1

      - name: integration tests
        env:
          CLICKHOUSE_TEST_ADDR: localhost:9000
          CLICKHOUSE_TEST_USER: default
          CLICKHOUSE_TEST_PASSWORD: ci_test
          CLICKHOUSE_TEST_DB: default
        run: |
          set +e
          go test -tags=integration -count=1 ./internal/adapter/clickhouse/ -run Integration -v
          status=$?
          go test -tags=integration -count=1 ./internal/adapter/httpapi/ -run Integration -v
          status2=$?
          if [ "$status" -ne 0 ] || [ "$status2" -ne 0 ]; then
            echo "::group::ClickHouse diagnostics"
            curl -fsS -G http://127.0.0.1:8123/ \
              --data-urlencode "user=default" \
              --data-urlencode "password=ci_test" \
              --data-urlencode "query=SELECT version() AS version, timezone() AS timezone FORMAT Vertical" || true
            curl -fsS -G http://127.0.0.1:8123/ \
              --data-urlencode "user=default" \
              --data-urlencode "password=ci_test" \
              --data-urlencode "query=SELECT name, engine FROM system.tables WHERE database = currentDatabase() ORDER BY name FORMAT Vertical" || true
            container_id="$(docker ps -q --filter 'ancestor=clickhouse/clickhouse-server:25.8.33.6')"
            if [ -n "$container_id" ]; then
              docker logs --tail 200 "$container_id" || true
            fi
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              exit "$status"
            fi
            exit "$status2"
          fi

  stats-collector:
    name: stats-collector (test + lint)
    needs: changes
    if: needs.changes.outputs.stats == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stats-collector
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: |
            stats-collector/go.sum
            stats-collector/go.mod
            pkg/chconn/go.sum
            pkg/chconn/go.mod
            pkg/syslogngstats/go.mod

      - name: go mod download
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          working-directory: stats-collector
          args: --timeout=3m

  govulncheck:
    name: govulncheck (Go modules)
    needs: changes
    if: needs.changes.outputs.govulncheck == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: |
            backend/go.sum
            backend/go.mod
            stats-collector/go.sum
            stats-collector/go.mod
            pkg/chconn/go.sum
            pkg/chconn/go.mod
            pkg/syslogngstats/go.mod

      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: govulncheck
        run: bash scripts/ci-govulncheck.sh

  docker-images:
    name: docker (${{ matrix.image }})
    needs: changes
    if: needs.changes.outputs.docker_any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.docker_images) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # docker-container driver: type=gha cache + --load for /health smoke.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: build image
        env:
          GA_DOCKER_CACHE: gha
        run: bash scripts/ci-docker-build.sh ${{ matrix.image }}

  frontend-smoke:
    name: frontend (SPA contract smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: SPA / nginx contract
        run: bash scripts/frontend-smoke.sh

  trivy:
    name: trivy (fs CRITICAL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Pin commit (annotated tag v0.36.0). Do not use 0.28.0 — tag was pulled after the 2026 supply-chain incident.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
          exit-code: "0"

      - uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  frontend:
    name: frontend (build + test)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: lint
        run: npm run lint

      - name: knip
        run: npm run knip

      - name: vitest
        run: npm test

      - name: vitest coverage (auth/api smoke)
        run: npm run test:coverage

      - name: npm audit (production, high+)
        run: npm audit --omit=dev --audit-level=high

      - name: typecheck
        run: npm run typecheck

      - name: OpenAPI types in sync
        run: npx openapi-typescript ../openapi.yaml -o src/api/openapi.d.ts && git diff --exit-code -- src/api/openapi.d.ts

      - name: vite build
        run: npm run build

      - name: Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright e2e (auth/CSRF/roles)
        run: npm run test:e2e

      - name: Built shell + auth contract
        run: |
          python3 -m http.server 8765 --directory dist >/tmp/http-frontend.log 2>&1 &
          echo $! > /tmp/http-frontend.pid
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/ >/dev/null && break
            sleep 0.2
          done
          html=$(curl -sf http://127.0.0.1:8765/)
          echo "$html" | grep -q 'id="root"'
          echo "$html" | grep -q 'config.js'
          echo "$html" | grep -q 'theme-boot.js'
          kill "$(cat /tmp/http-frontend.pid)" || true
          grep -q 'id="username"' src/pages/Login/LoginPage.tsx
          grep -q 'id="password"' src/pages/Login/LoginPage.tsx
          grep -q '/api/auth/login' src/api/auth.ts
          grep -q '/api/auth/logout-all' src/api/auth.ts
          grep -q 'X-CSRF-Token' src/api/client.ts
          grep -q 'ga_csrf' src/api/client.ts
          grep -q 'ga-theme-change' src/auth/theme.ts

  ci-ok:
    name: CI status (required)
    if: always()
    needs:
      - changes
      - release-contract
      - shellcheck
      - backend
      - chconn
      - syslogngstats
      - backend-integration
      - stats-collector
      - govulncheck
      - docker-images
      - frontend-smoke
      - trivy
      - frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: aggregate job results
        env:
          RELEASE_CONTRACT_RESULT: ${{ needs.release-contract.result }}
          FRONTEND_SMOKE_RESULT: ${{ needs.frontend-smoke.result }}
          TRIVY_RESULT: ${{ needs.trivy.result }}
          SHELL_GATE: ${{ needs.changes.outputs.shell }}
          SHELLCHECK_RESULT: ${{ needs.shellcheck.result }}
          BACKEND_GATE: ${{ needs.changes.outputs.backend }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          CHCONN_GATE: ${{ needs.changes.outputs.chconn }}
          CHCONN_RESULT: ${{ needs.chconn.result }}
          SYSLOGNGSTATS_GATE: ${{ needs.changes.outputs.syslogngstats }}
          SYSLOGNGSTATS_RESULT: ${{ needs.syslogngstats.result }}
          INTEGRATION_GATE: ${{ needs.changes.outputs.integration }}
