name: Release tag

on:
  push:
    tags: ["v*"]

jobs:
  release-contract:
    name: tag matches VERSION / CHANGELOG / OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: check release contract
        run: bash scripts/check-release-contract.sh

  github-release:
    name: GitHub Release from CHANGELOG
    needs: release-contract
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          notes="$(mktemp)"
          awk -v v="$VER" '
            $0 ~ "^## \\[" v "\\]" { p = 1; next }
            p && /^## \[/ { exit }
            p { print }
          ' CHANGELOG.md >"$notes"
          if [[ ! -s "$notes" ]]; then
            echo "empty CHANGELOG notes for ${VER}" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release ${TAG} already exists"
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$notes"
          fi
      - name: pack install tarball
        run: bash scripts/pack-release.sh

      - name: download syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          run: download-syft
          syft-version: v1.51.0

      - name: SBOM (CycloneDX + SPDX)
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: bash scripts/ci-sbom.sh

      - name: upload install package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          shopt -s nullglob
          files=(dist/geoatlas-*.tar.gz dist/geoatlas-*.tar.gz.sha256 dist/geoatlas-*.cdx.json dist/geoatlas-*.spdx.json)
          [[ ${#files[@]} -ge 4 ]] || { echo "missing dist/geoatlas-* artifacts" >&2; ls -la dist/ >&2; exit 1; }
          gh release upload "$TAG" "${files[@]}" --clobber
