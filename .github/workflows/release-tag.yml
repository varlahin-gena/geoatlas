name: Release tag

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release-contract:
    name: tag matches VERSION / CHANGELOG / OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: check release contract
        run: bash scripts/check-release-contract.sh

  github-release:
    name: GitHub Release from CHANGELOG
    needs: release-contract
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      id-token: write # cosign keyless (Sigstore)
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          notes="$(mktemp)"
          awk -v v="$VER" '
            $0 ~ "^## \\[" v "\\]" { p = 1; next }
            p && /^## \[/ { exit }
            p { print }
          ' CHANGELOG.md >"$notes"
          if [[ ! -s "$notes" ]]; then
            echo "empty CHANGELOG notes for ${VER}" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release ${TAG} already exists"
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$notes"
          fi
      - name: free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: pack install tarball (with Docker images)
        run: bash scripts/pack-release.sh --with-images

      - name: download syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          run: download-syft
          syft-version: v1.51.0

      - name: SBOM (CycloneDX + SPDX)
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: bash scripts/ci-sbom.sh

      - name: install grype
        run: |
          set -euo pipefail
          ver=0.120.1
          archive="grype_${ver}_linux_amd64.tar.gz"
          expected_sha256=0a9ee97ef5ae2ee953b0a80098105052e846cdbe319a57d808b519c33cd1343d
          curl --proto '=https' --tlsv1.2 -sSfL -o "$archive" \
            "https://github.com/anchore/grype/releases/download/v${ver}/${archive}"
          echo "${expected_sha256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C /usr/local/bin grype
          grype version

      - name: grype (SBOM CRITICAL, only-fixed)
        run: bash scripts/ci-grype-release.sh

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: cosign sign-blob (keyless)
        run: bash scripts/ci-cosign-sign.sh

      - name: upload install package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          shopt -s nullglob
          files=(
            dist/geoatlas-*.tar.gz
            dist/geoatlas-*.tar.gz.sha256
            dist/geoatlas-*.cdx.json
            dist/geoatlas-*.spdx.json
            dist/geoatlas-*.tar.gz.cosign.bundle
          )
          [[ ${#files[@]} -ge 5 ]] || { echo "missing dist/geoatlas-* artifacts" >&2; ls -la dist/ >&2; exit 1; }
          gh release upload "$TAG" "${files[@]}" --clobber
