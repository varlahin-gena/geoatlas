# Nightly: longer fuzz + full compose smoke. Advisory (not in ci-ok / ruleset).

name: Nightly

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOWORK: "off"
  GOTOOLCHAIN: local

jobs:
  fuzz:
    name: fuzz (long)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: |
            backend/go.sum
            backend/go.mod
            pkg/chconn/go.sum
            pkg/chconn/go.mod
            pkg/syslogngstats/go.mod

      - name: long fuzz
        run: bash scripts/ci-fuzz-nightly.sh

  compose-smoke:
    name: compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: compose smoke (up / health / down)
        env:
          HTTP_PORT: "18080"
          COMPOSE_PROJECT_NAME: geoatlas-ci-smoke
        run: bash scripts/ci-compose-smoke.sh
