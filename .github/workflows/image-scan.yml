name: Image scan

on:
  schedule:
    - cron: "20 4 * * 1"
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - "docker-compose.yml"
      - "**/Dockerfile"
      - "syslog-ng/**"
      - ".github/workflows/image-scan.yml"
  pull_request:
    paths:
      - "docker-compose.yml"
      - "**/Dockerfile"
      - "syslog-ng/**"
      - ".github/workflows/image-scan.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trivy-images:
    name: trivy (compose images)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Scan built app images (apk-upgraded OpenSSL), not raw upstream alpine/nginx tags.
      - name: Build geoatlas-frontend
        run: docker build -t geoatlas-frontend:scan -f frontend/Dockerfile frontend

      - name: Build geoatlas-backend
        run: docker build -t geoatlas-backend:scan -f backend/Dockerfile .

      - name: Build geoatlas-stats-collector
        run: docker build -t geoatlas-stats-collector:scan -f stats-collector/Dockerfile .

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: geoatlas-frontend:scan
          severity: CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-frontend.sarif
          exit-code: "1"

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: geoatlas-backend:scan
          severity: CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-backend.sarif
          exit-code: "1"

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: geoatlas-stats-collector:scan
          severity: CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-stats.sarif
          exit-code: "1"

      - name: Build geoatlas-clickhouse
        run: docker build -t geoatlas-clickhouse:scan -f clickhouse/Dockerfile clickhouse

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: geoatlas-clickhouse:scan
          severity: CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-clickhouse.sarif
          exit-code: "1"

      # Public ingest :514 — build hardened image (4.12.0 + apt/python patches).
      - name: Build geoatlas-syslog-ng
        run: docker build -t geoatlas-syslog-ng:scan -f syslog-ng/Dockerfile syslog-ng

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: geoatlas-syslog-ng:scan
          severity: CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-syslog-ng.sarif
          exit-code: "1"

      - uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        if: always()
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

      - uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        if: always()
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        if: always()
        with:
          sarif_file: trivy-stats.sarif
          category: trivy-stats

      - uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        if: always()
        with:
          sarif_file: trivy-clickhouse.sarif
          category: trivy-clickhouse

      - uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        if: always()
        with:
          sarif_file: trivy-syslog-ng.sarif
          category: trivy-syslog-ng

      # Close orphaned alerts from former categories (raw alpine/nginx tags).
      # GitHub only auto-closes when the same category uploads again with fewer findings.
      - name: Empty SARIF for retired trivy-alpine / trivy-nginx categories
        run: |
          cat > trivy-empty.sarif <<'EOF'
          {
            "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            "version": "2.1.0",
            "runs": [
              {
                "tool": {
                  "driver": {
                    "name": "Trivy",
                    "informationUri": "https://github.com/aquasecurity/trivy",
                    "version": "0.0.0",
                    "rules": []
                  }
                },
                "results": []
              }
            ]
          }
          EOF

      - uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        if: always()
        with:
          sarif_file: trivy-empty.sarif
          category: trivy-alpine

      - uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        if: always()
        with:
          sarif_file: trivy-empty.sarif
          category: trivy-nginx
