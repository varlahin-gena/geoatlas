name: Image scan

on:
  schedule:
    - cron: "20 4 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "docker-compose.yml"
      - "**/Dockerfile"
      - ".github/workflows/image-scan.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trivy-images:
    name: trivy (compose images)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: nginx:1.30.4-alpine
          severity: CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-nginx.sarif
          exit-code: "0"

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: alpine:3.23
          severity: CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-alpine.sarif
          exit-code: "0"

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: clickhouse/clickhouse-server:25.8.30.16
          severity: CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-clickhouse.sarif
          exit-code: "0"

      # Public ingest path :514 — pin must match docker-compose.yml.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: balabit/syslog-ng:4.11.0
          severity: CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-syslog-ng.sarif
          exit-code: "0"

      - uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        if: always()
        with:
          sarif_file: trivy-nginx.sarif
          category: trivy-nginx

      - uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        if: always()
        with:
          sarif_file: trivy-alpine.sarif
          category: trivy-alpine

      - uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        if: always()
        with:
          sarif_file: trivy-clickhouse.sarif
          category: trivy-clickhouse

      - uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        if: always()
        with:
          sarif_file: trivy-syslog-ng.sarif
          category: trivy-syslog-ng
