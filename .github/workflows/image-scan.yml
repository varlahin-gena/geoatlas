name: Image scan

on:
  schedule:
    - cron: "20 4 * * 1"
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - "docker-compose.yml"
      - "**/Dockerfile"
      - "syslog-ng/**"
      - ".github/workflows/image-scan.yml"
  pull_request:
    paths:
      - "docker-compose.yml"
      - "**/Dockerfile"
      - "syslog-ng/**"
      - ".github/workflows/image-scan.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trivy-images:
    name: trivy (compose images)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Scan built app images (apk-upgraded OpenSSL), not raw upstream alpine/nginx tags.
      - name: Build geoatlas-frontend
        run: docker build -t geoatlas-frontend:scan -f frontend/Dockerfile frontend

      - name: Build geoatlas-backend
        run: docker build -t geoatlas-backend:scan -f backend/Dockerfile .

      - name: Build geoatlas-stats-collector
        run: docker build -t geoatlas-stats-collector:scan -f stats-collector/Dockerfile .

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: geoatlas-frontend:scan
          severity: CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-frontend.sarif
          exit-code: "0"

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: geoatlas-backend:scan
          severity: CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-backend.sarif
          exit-code: "0"

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: geoatlas-stats-collector:scan
          severity: CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-stats.sarif
          exit-code: "0"

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: clickhouse/clickhouse-server:25.8.30.16
          severity: CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-clickhouse.sarif
          exit-code: "0"

      # Public ingest :514 — build hardened image (4.12.0 + apt/python patches).
      - name: Build geoatlas-syslog-ng
        run: docker build -t geoatlas-syslog-ng:scan -f syslog-ng/Dockerfile syslog-ng

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: geoatlas-syslog-ng:scan
          severity: CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-syslog-ng.sarif
          exit-code: "0"

      - uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        if: always()
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

      - uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        if: always()
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        if: always()
        with:
          sarif_file: trivy-stats.sarif
          category: trivy-stats

      - uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        if: always()
        with:
          sarif_file: trivy-clickhouse.sarif
          category: trivy-clickhouse

      - uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        if: always()
        with:
          sarif_file: trivy-syslog-ng.sarif
          category: trivy-syslog-ng
