name: Hadolint

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "15 7 * * 0"

permissions:
  contents: read

jobs:
  hadolint:
    name: Run hadolint scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run hadolint backend dockerfile
        uses: hadolint/hadolint-action@f988afea3da57ee48710a9795b6bb677cc901183
        with:
          dockerfile: backend/Dockerfile
          format: sarif
          output-file: hadolint-backend.sarif
          no-fail: true

      - name: Run hadolint frontend dockerfile
        uses: hadolint/hadolint-action@f988afea3da57ee48710a9795b6bb677cc901183
        with:
          dockerfile: frontend/Dockerfile
          format: sarif
          output-file: hadolint-frontend.sarif
          no-fail: true

      - name: Run hadolint stats-collector dockerfile
        uses: hadolint/hadolint-action@f988afea3da57ee48710a9795b6bb677cc901183
        with:
          dockerfile: stats-collector/Dockerfile
          format: sarif
          output-file: hadolint-stats-collector.sarif
          no-fail: true

      - name: Upload backend analysis results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: hadolint-backend.sarif
          category: hadolint-backend
          wait-for-processing: true

      - name: Upload frontend analysis results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: hadolint-frontend.sarif
          category: hadolint-frontend
          wait-for-processing: true

      - name: Upload stats-collector analysis results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: hadolint-stats-collector.sarif
          category: hadolint-stats-collector
          wait-for-processing: true
