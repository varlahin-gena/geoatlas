services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8.28.1
    container_name: clickhouse
    expose:
      - "8123"
      - "9000"
    environment:
      # users.d смонтирован :ro — entrypoint не должен писать default-user.xml
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    volumes:
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      - ./clickhouse/users.d:/etc/clickhouse-server/users.d:ro
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 6g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  syslog-ng:
    image: balabit/syslog-ng:4.8.3
    container_name: syslog-ng
    profiles: ["syslog"]
    ports:
      - "514:514/tcp"
      - "514:514/udp"
    volumes:
      - ./syslog-ng.conf:/etc/syslog-ng/syslog-ng.conf:ro
      - syslog-ng-buffer:/var/lib/syslog-ng-buffer
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: backend
    expose:
      - "8080"
      - "1514"
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-default}
      INGEST_LISTEN_ADDR: ":1514"
      INGEST_WORKERS: "4"
      INGEST_BATCH_SIZE: "10000"
      INGEST_QUEUE_SIZE: "300000"
      INGEST_FLUSH_SEC: "3"
      INGEST_MAX_CONNECTIONS: "256"
      INGEST_CONN_IDLE_SEC: "300"
      GOMAXPROCS: "4"
      CH_MAX_MEMORY_USAGE: "2147483648"
      CH_EXTERNAL_GROUP_BY_BYTES: "268435456"
      CH_EXTERNAL_SORT_BYTES: "268435456"
      CH_INGEST_MAX_OPEN_CONNS: "4"
      CH_INGEST_ASYNC_INSERT: "true"
      CH_API_MAX_OPEN_CONNS: "8"
      CH_BACKGROUND_MAX_OPEN_CONNS: "2"
      GEO_ENRICH_ON_INGEST: "true"
      GEO_BACKFILL_LOOKBACK_DAYS: "7"
      REPUTATION_FETCH_ENABLED: ${REPUTATION_FETCH_ENABLED:-true}
      REPUTATION_FETCH_INTERVAL: "6h"
      LOG_LEVEL: info
      LOG_FORMAT: text
      INSTALL_PROFILE_PATH: /app/install-profile.json
      INSTALL_META_PATH: /app/install-meta.json
      # Обязателен, если API_AUTH_DISABLED не true. Генерируется в start.sh → .env
      # Плейсхолдер ниже отвергается backend'ом без NM_ALLOW_INSECURE=1.
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-dev-insecure-change-me}
      API_AUTH_DISABLED: ${API_AUTH_DISABLED:-false}
      # Локальный логин (роли administrator / operator). Пароли — в .env.
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-me}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      AUTH_ADMIN_USER: ${AUTH_ADMIN_USER:-admin}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:-admin}
      AUTH_OPERATOR_USER: ${AUTH_OPERATOR_USER:-operator}
      AUTH_OPERATOR_PASSWORD: ${AUTH_OPERATOR_PASSWORD:-operator}
      AUTH_USERS_FILE: /app/data/users.json
      RETENTION_FILE: /app/data/retention.json
      REPUTATION_FEEDS_FILE: /app/data/reputation_feeds.json
      # Только local/dev: плейсхолдеры секретов и/или AUTH_DISABLED / API_AUTH_DISABLED
      NM_ALLOW_INSECURE: ${NM_ALLOW_INSECURE:-0}
      TZ: Europe/Moscow
    volumes:
      - ./install-profile.json:/app/install-profile.json:ro
      - ./install-meta.json:/app/install-meta.json:ro
      - auth-users:/app/data
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  stats-collector:
    build:
      context: .
      dockerfile: stats-collector/Dockerfile
    container_name: stats-collector
    profiles: ["stats"]
    depends_on:
      backend:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-default}
      COLLECT_INTERVAL: "30"
      BACKEND_HEALTH_URL: http://backend:8080/health
      INGEST_STATS_URL: http://backend:8080/api/ingest/stats
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-dev-insecure-change-me}
      CGROUP_ROOT: /sys/fs/cgroup
      HOST_PROC: /host/proc
      TZ: Europe/Moscow
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /proc:/host/proc:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  frontend:
    image: nginx:1.27-alpine
    container_name: frontend
    ports:
      - "${HTTP_PORT:-80}:80"
      # HTTPS: см. docker-compose.https.yml (подключается start.sh / nm_compose)
    environment:
      HTTPS_ENABLED: ${HTTPS_ENABLED:-auto}
      HTTP_REDIRECT: ${HTTP_REDIRECT:-1}
      SSL_CERT_FILE: ${SSL_CERT_FILE:-/etc/nginx/certs/fullchain.pem}
      SSL_KEY_FILE: ${SSL_KEY_FILE:-/etc/nginx/certs/privkey.pem}
    entrypoint: ["/bin/sh", "/docker-entrypoint-nm.sh"]
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx-app.inc:/etc/nginx/includes/app.inc:ro
      - ./frontend/docker-entrypoint.sh:/docker-entrypoint-nm.sh:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  clickhouse-data:
  syslog-ng-buffer:
  auth-users:

networks:
  default:
    name: network-monitor
    driver: bridge
