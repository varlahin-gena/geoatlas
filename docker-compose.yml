services:
  # Выровнять владельца томов под uid 101 (clickhouse + backend).
  # Нужно после смены backend с 10001→101 и для записи *.auth.tgz на clickhouse-backups.
  volume-perms:
    image: alpine:3.23
    container_name: ga-volume-perms
    volumes:
      - clickhouse-backups:/var/lib/clickhouse-backups
      - auth-users:/app/data
    command:
      - sh
      - -c
      - |
        mkdir -p /var/lib/clickhouse-backups /app/data
        chown -R 101:101 /var/lib/clickhouse-backups /app/data
        chmod 2775 /var/lib/clickhouse-backups /app/data
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:25.8.30.16
    container_name: clickhouse
    expose:
      - "8123"
      - "9000"
    environment:
      # users.d смонтирован :ro — entrypoint не должен писать default-user.xml
      CLICKHOUSE_SKIP_USER_SETUP: "1"
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
    volumes:
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      - ./clickhouse/users.d:/etc/clickhouse-server/users.d:ro
      - clickhouse-data:/var/lib/clickhouse
      # Отдельный том: native BACKUP/RESTORE (см. scripts/backup-clickhouse.sh)
      - clickhouse-backups:/var/lib/clickhouse-backups
    depends_on:
      volume-perms:
        condition: service_completed_successfully
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 6g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  syslog-ng:
    build:
      context: ./syslog-ng
      dockerfile: Dockerfile
    image: geoatlas-syslog-ng:latest
    container_name: syslog-ng
    profiles: ["syslog"]
    ports:
      - "514:514/tcp"
      - "514:514/udp"
    expose:
      - "9577"
    volumes:
      - ./syslog-ng.conf:/etc/syslog-ng/syslog-ng.conf:ro
      - ./syslog-ng.d:/etc/syslog-ng/conf.d:ro
      - syslog-ng-buffer:/var/lib/syslog-ng-buffer
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "syslog-ng-ctl", "stats"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: geoatlas-backend:latest
    container_name: backend
    expose:
      - "8080"
      - "1514"
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-default}
      INGEST_LISTEN_ADDR: ":1514"
      INGEST_WORKERS: "4"
      INGEST_BATCH_SIZE: "10000"
      INGEST_QUEUE_SIZE: "300000"
      INGEST_FLUSH_SEC: "3"
      INGEST_MAX_CONNECTIONS: "256"
      INGEST_CONN_IDLE_SEC: "300"
      INGEST_SHARED_SECRET: ${INGEST_SHARED_SECRET:?set INGEST_SHARED_SECRET in .env}
      INGEST_ALLOW_FROM: ${INGEST_ALLOW_FROM:-syslog-ng}
      GA_TRUSTED_PROXIES: ${GA_TRUSTED_PROXIES:-frontend}
      GOMAXPROCS: "4"
      CH_MAX_MEMORY_USAGE: "2147483648"
      CH_EXTERNAL_GROUP_BY_BYTES: "268435456"
      CH_EXTERNAL_SORT_BYTES: "268435456"
      CH_INGEST_MAX_OPEN_CONNS: "4"
      CH_INGEST_ASYNC_INSERT: "true"
      CH_API_MAX_OPEN_CONNS: "8"
      CH_BACKGROUND_MAX_OPEN_CONNS: "2"
      GEO_ENRICH_ON_INGEST: "true"
      GEO_BACKFILL_LOOKBACK_DAYS: "7"
      REPUTATION_FETCH_ENABLED: ${REPUTATION_FETCH_ENABLED:-true}
      REPUTATION_FETCH_INTERVAL: "6h"
      ANOMALY_ENABLED: ${ANOMALY_ENABLED:-true}
      ANOMALY_SCAN_INTERVAL: ${ANOMALY_SCAN_INTERVAL:-5m}
      ANOMALY_INCLUDE_PRIVATE: ${ANOMALY_INCLUDE_PRIVATE:-false}
      ANOMALY_LEARNING_DAYS: ${ANOMALY_LEARNING_DAYS:-3}
      LOG_LEVEL: info
      LOG_FORMAT: text
      INSTALL_PROFILE_PATH: /app/install-profile.json
      INSTALL_META_PATH: /app/install-meta.json
      # Пустая строка в .env отключает scrape (модуль syslog выключен).
      SYSLOG_STATS_URL: "${SYSLOG_STATS_URL-http://syslog-ng:9577/stats}"
      # Обязателен, если API_AUTH_DISABLED не true. Генерируется в start.sh → .env
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:?set API_AUTH_TOKEN in .env}
      # Sidecar ops Bearer (stats-collector); optional — fallback на API_AUTH_TOKEN
      API_OPS_TOKEN: ${API_OPS_TOKEN:-}
      API_AUTH_DISABLED: ${API_AUTH_DISABLED:-false}
      # Локальный логин (seed только admin). Operator — опционально, иначе УЗ в UI.
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      AUTH_ADMIN_USER: ${AUTH_ADMIN_USER:-admin}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:?set AUTH_ADMIN_PASSWORD in .env}
      AUTH_ADMIN_MUST_RESET: ${AUTH_ADMIN_MUST_RESET:-0}
      AUTH_OPERATOR_USER: ${AUTH_OPERATOR_USER:-}
      AUTH_OPERATOR_PASSWORD: ${AUTH_OPERATOR_PASSWORD:-}
      AUTH_USERS_FILE: /app/data/users.json
      GEOIP_SNAPSHOT_FILE: ${GEOIP_SNAPSHOT_FILE:-}
      RETENTION_FILE: /app/data/retention.json
      REPUTATION_FEEDS_FILE: /app/data/reputation_feeds.json
      BACKUP_DIR: /var/lib/clickhouse-backups
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      BACKUP_INCLUDE_EDGES: ${BACKUP_INCLUDE_EDGES:-true}
      BACKUP_INCLUDE_AUTH: ${BACKUP_INCLUDE_AUTH:-true}
      BACKUP_SCHEDULE_FILE: /app/data/backup_schedule.json
      TLS_CERT_DIR: /certs
      TLS_CERT_FILE: fullchain.pem
      TLS_KEY_FILE: privkey.pem
      HTTPS_ENABLED: ${HTTPS_ENABLED:-auto}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      HTTP_REDIRECT: ${HTTP_REDIRECT:-1}
      # Только local/dev: legacy placeholders и/или AUTH_DISABLED / API_AUTH_DISABLED
      GA_ALLOW_INSECURE: ${GA_ALLOW_INSECURE:-0}
      TZ: Europe/Moscow
    volumes:
      - ./install-profile.json:/app/install-profile.json:ro
      - ./install-meta.json:/app/install-meta.json:ro
      - auth-users:/app/data
      - clickhouse-backups:/var/lib/clickhouse-backups
      - ./certs:/certs:rw
    depends_on:
      volume-perms:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  stats-collector:
    build:
      context: .
      dockerfile: stats-collector/Dockerfile
    image: geoatlas-stats-collector:latest
    container_name: stats-collector
    profiles: ["stats"]
    depends_on:
      backend:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-default}
      COLLECT_INTERVAL: "30"
      BACKEND_HEALTH_URL: http://backend:8080/live
      INGEST_STATS_URL: http://backend:8080/api/ingest/stats
      SYSLOG_STATS_URL: "${SYSLOG_STATS_URL-http://syslog-ng:9577/stats}"
      API_OPS_TOKEN: ${API_OPS_TOKEN:-}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:?set API_AUTH_TOKEN in .env}
      CGROUP_ROOT: /sys/fs/cgroup
      HOST_PROC: /host/proc
      TZ: Europe/Moscow
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /proc:/host/proc:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: geoatlas-frontend:latest
    container_name: frontend
    ports:
      - "${HTTP_PORT:-80}:80"
      # HTTPS: см. docker-compose.https.yml (подключается start.sh / ga_compose)
    environment:
      HTTPS_ENABLED: ${HTTPS_ENABLED:-auto}
      HTTP_REDIRECT: ${HTTP_REDIRECT:-1}
      SSL_CERT_FILE: ${SSL_CERT_FILE:-/etc/nginx/certs/fullchain.pem}
      SSL_KEY_FILE: ${SSL_KEY_FILE:-/etc/nginx/certs/privkey.pem}
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # nginx master: bind :80/:443, chown cache dirs, drop workers to uid 101.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  clickhouse-data:
  clickhouse-backups:
  syslog-ng-buffer:
  auth-users:

networks:
  default:
    name: geoatlas
    driver: bridge
