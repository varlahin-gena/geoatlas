<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ГеоАтлас — Смена пароля</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<script>
(function () {
  try {
    var t = localStorage.getItem('nm.theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="/theme.css" />
<link rel="stylesheet" href="/common.css" />
<link rel="stylesheet" href="/auth-form.css" />
</head>
<body class="page-auth">
  <a class="skip-link" href="#form">К форме</a>
  <form class="auth-card wide" id="form" autocomplete="on">
    <div class="auth-brand">
      <img class="logo" src="/logo.png" alt="" width="40" height="40" />
      <div>
        <h1>Смена пароля</h1>
        <p id="subtitle">Установите новый пароль</p>
      </div>
    </div>
    <div class="auth-notice" id="notice">Требуется смена пароля при первом входе.</div>
    <div class="auth-error" id="error" role="alert"></div>
    <label for="old">Текущий пароль</label>
    <input id="old" type="password" autocomplete="current-password" required />
    <label for="neu">Новый пароль</label>
    <input id="neu" type="password" autocomplete="new-password" required minlength="8" />
    <label for="neu2">Повтор нового пароля</label>
    <input id="neu2" type="password" autocomplete="new-password" required minlength="8" />
    <button type="submit" id="btn">Сохранить</button>
    <p class="auth-hint">Минимум 8 символов.</p>
  </form>
<script src="/config.js"></script>
<script src="/auth.js"></script>
<script src="/common.js"></script>
<script>
'use strict';
(async function () {
  const params = new URLSearchParams(location.search);
  const next = NMAuth.safeNext(params.get('next') || '/index.html');

  const user = await NMAuth.requireLogin({ allowMustReset: true });
  if (!user) return;
  if (!user.must_reset_password) {
    document.getElementById('notice').style.display = 'none';
    document.getElementById('subtitle').textContent = 'Смена пароля учётной записи';
  }

  const form = document.getElementById('form');
  const err = document.getElementById('error');
  const btn = document.getElementById('btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.classList.remove('show');
    const oldP = document.getElementById('old').value;
    const neu = document.getElementById('neu').value;
    const neu2 = document.getElementById('neu2').value;
    if (neu !== neu2) {
      err.textContent = 'Пароли не совпадают';
      err.classList.add('show');
      return;
    }
    if (neu.length < 8) {
      err.textContent = 'Новый пароль: минимум 8 символов';
      err.classList.add('show');
      return;
    }
    btn.disabled = true;
    try {
      const res = await fetch('/api/auth/change-password', {
        method: 'POST',
        credentials: 'same-origin',
        headers: NMAuth.nmAuthHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ old_password: oldP, new_password: neu }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        err.textContent = data.error === 'current password is incorrect'
          ? 'Неверный текущий пароль'
          : (data.error || 'Ошибка');
        err.classList.add('show');
        return;
      }
      location.replace(next);
    } catch (ex) {
      err.textContent = 'Сервер недоступен';
      err.classList.add('show');
    } finally {
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
