<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ГеоАтлас — Ошибки парсинга</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<script>
(function () {
  try {
    var t = localStorage.getItem('nm.theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="/theme.css" />
<link rel="stylesheet" href="/common.css" />
<style>
td.raw { font-family: ui-monospace, Menlo, Consolas, monospace; color: var(--text-dim); max-width: 520px; overflow-wrap: anywhere; }
td.reason { color: var(--orange); max-width: 260px; overflow-wrap: anywhere; }
td.ts { color: var(--text-muted); white-space: nowrap; }
.col-check { width: 36px; text-align: center; }
.col-check input { accent-color: var(--accent); cursor: pointer; }
.row-del {
  background: transparent; border: none; color: var(--text-muted);
  cursor: pointer; padding: 4px 6px; border-radius: 4px;
}
.row-test {
  background: transparent; border: 1px solid var(--border); color: var(--text-dim);
  cursor: pointer; padding: 3px 8px; border-radius: 4px; font-size: 11px; margin-right: 4px;
}
.row-test:hover { background: var(--panel-3); color: var(--accent); border-color: var(--accent); }
.row-del:hover { background: rgba(248,81,73,0.15); color: var(--red); }
</style>
</head>
<body class="page-admin">
<header id="adminTopbar"></header>

<main class="page-content" id="main-content">
  <div class="page-content-inner">
    <h1>Строки, которые не удалось нормализовать</h1>
    <p class="hint">
      Здесь собираются строки логов, которые ни один парсер не смог разобрать.
      Записи автоматически удаляются по TTL через 7 дней; ниже можно удалить их вручную.
    </p>

    <div class="toolbar">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" id="search" placeholder="Поиск по строке или причине…" />
      </div>
      <select id="limit" class="limit">
        <option value="200">200</option>
        <option value="500" selected>500</option>
        <option value="1000">1000</option>
        <option value="2000">2000</option>
      </select>
      <button class="btn btn-secondary" id="refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        Обновить
      </button>
      <div class="spacer"></div>
      <span class="count-badge" id="countBadge"></span>
      <button class="btn btn-danger" id="delSelected" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
        Удалить выбранные
      </button>
      <button class="btn btn-danger" id="delAll">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
        Удалить все
      </button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
                <tr>
                    <th class="col-check" scope="col"><input type="checkbox" id="selectAll" title="Выбрать все" aria-label="Выбрать все" /></th>
                    <th scope="col">Время</th>
                    <th scope="col">Vendor</th>
                    <th scope="col">Причина</th>
                    <th scope="col">Строка (raw)</th>
                    <th scope="col"><span class="visually-hidden">Действия</span></th>
                </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="6" class="empty">Загрузка…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<div class="toast-host" id="toastHost" aria-live="polite"></div>

<script src="/config.js"></script>
<script src="/auth.js"></script>
<script src="/common.js"></script>
<script>
'use strict';
const $ = NMUI.$;
const esc = NMUI.escapeHTML;
const toast = NMUI.toast;
const fmtTs = NMUI.fmtDate;

let rows = [];
let searchTimer = null;

function nmAuthHeaders(extra) {
  return window.NMAuth ? NMAuth.nmAuthHeaders(extra) : Object.assign({}, extra || {});
}

function selectedIds() {
  return [...document.querySelectorAll('.row-chk:checked')].map(c => c.dataset.id);
}
function syncControls() {
  const sel = selectedIds().length;
  $('delSelected').disabled = sel === 0;
  $('delSelected').lastChild.textContent = sel ? ` Удалить выбранные (${sel})` : ' Удалить выбранные';
  const all = document.querySelectorAll('.row-chk');
  $('selectAll').checked = all.length > 0 && sel === all.length;
  $('countBadge').textContent = rows.length ? `Показано: ${rows.length}` : '';
}

function render() {
  const tbody = $('tbody');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty">Нет нераспознанных строк</td></tr>';
    syncControls();
    return;
  }
  tbody.innerHTML = '';
  rows.forEach(r => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="col-check"><input type="checkbox" class="row-chk" data-id="${esc(r.id)}" /></td>
      <td class="ts">${esc(fmtTs(r.timestamp))}</td>
      <td>${esc(r.vendor) || '—'}</td>
      <td class="reason">${esc(r.reason)}</td>
      <td class="raw">${esc(r.raw)}</td>
      <td style="white-space:nowrap;">
        <button class="row-test" data-id="${esc(r.id)}" title="Отправить строку в тест парсеров">→ Тест</button>
        <button class="row-del" data-id="${esc(r.id)}" title="Удалить запись">✕</button>
      </td>`;
    tbody.appendChild(tr);
  });
  tbody.querySelectorAll('.row-chk').forEach(c => c.addEventListener('change', syncControls));
  tbody.querySelectorAll('.row-del').forEach(b =>
    b.addEventListener('click', () => deleteIds([b.dataset.id])));
  tbody.querySelectorAll('.row-test').forEach(b =>
    b.addEventListener('click', () => sendToParserTest(b.dataset.id)));
  syncControls();
}

function sendToParserTest(id) {
  const row = rows.find(r => r.id === id);
  if (!row) return;
  try { localStorage.setItem('nm.parserTest.prefill', row.raw); } catch (e) {}
  window.open('/parser-test.html', '_blank');
}

async function load() {
  const limit = $('limit').value;
  const search = $('search').value.trim();
  $('tbody').innerHTML = '<tr><td colspan="6" class="empty">Загрузка…</td></tr>';
  try {
    const url = `/api/parse-errors?limit=${encodeURIComponent(limit)}&search=${encodeURIComponent(search)}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    rows = data.errors || [];
    render();
  } catch (e) {
    $('tbody').innerHTML = `<tr><td colspan="6" class="empty">Ошибка загрузки: ${esc(e.message)}</td></tr>`;
    toast('Ошибка загрузки: ' + e.message, 'error');
  }
}

async function deleteIds(ids) {
  if (!ids.length) return;
  try {
    const res = await fetch('/api/parse-errors/delete', {
      method: 'POST',
      headers: nmAuthHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ ids })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    rows = rows.filter(r => !ids.includes(r.id));
    render();
    toast(`Удалено записей: ${ids.length}`, 'success', 2500);
  } catch (e) {
    toast('Ошибка удаления: ' + e.message, 'error');
  }
}

async function deleteAll() {
  if (!confirm('Удалить ВСЕ нераспознанные строки? Действие необратимо.')) return;
  try {
    const res = await fetch('/api/parse-errors/delete', {
      method: 'POST',
      headers: nmAuthHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ all: true })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    rows = [];
    render();
    toast('Таблица очищена', 'success', 2500);
  } catch (e) {
    toast('Ошибка очистки: ' + e.message, 'error');
  }
}

$('refresh').addEventListener('click', load);
$('limit').addEventListener('change', load);
$('search').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(load, 300);
});
$('selectAll').addEventListener('change', function () {
  document.querySelectorAll('.row-chk').forEach(c => { c.checked = this.checked; });
  syncControls();
});
$('delSelected').addEventListener('click', () => deleteIds(selectedIds()));
$('delAll').addEventListener('click', deleteAll);

(async function boot() {
  const bar = NMUI.mountAdminTopbar('#adminTopbar', {
    title: 'ГеоАтлас',
    subtitle: '· Ошибки парсинга',
  });
  const user = await NMAuth.requireLogin({ admin: true });
  if (!user) return;
  NMAuth.renderUserBar(user, bar.userBarHost);
  NMUI.startSystemHealthPolling({ isAdmin: true });
  load();
})();
</script>
</body>
</html>
