<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ГеоАтлас — Пользователи</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<script>
(function () {
  try {
    var t = localStorage.getItem('nm.theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="/theme.css" />
<link rel="stylesheet" href="/common.css" />
<style>
.fio-input {
  width: 100%;
  min-width: 180px;
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  padding: 6px 8px;
}
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.page-content { padding: 24px; }
</style>
</head>
<body class="page-admin">
<header id="adminTopbar"></header>

<main class="page-content" id="main-content">
  <div class="page-content-inner narrow">
    <div class="card">
      <h2>Создать учётную запись</h2>
      <form id="createForm" class="form-row">
        <div class="field" style="min-width:220px;flex:1;">
          <label for="cFio">ФИО</label>
          <input id="cFio" maxlength="200" placeholder="Иванов Иван Иванович" />
        </div>
        <div class="field">
          <label for="cUser">Логин</label>
          <input id="cUser" required pattern="[A-Za-z0-9._\-]{2,64}" title="2–64: латиница, цифры, . _ -" />
        </div>
        <div class="field">
          <label for="cPass">Пароль</label>
          <input id="cPass" type="password" required minlength="8" autocomplete="new-password" />
        </div>
        <div class="field">
          <label for="cRole">Роль</label>
          <select id="cRole">
            <option value="operator">Оператор</option>
            <option value="administrator">Администратор</option>
          </select>
        </div>
        <label class="checkbox" title="Пользователь обязан сменить пароль при первом входе">
          <input type="checkbox" id="cMustReset" checked />
          <span>Сброс пароля при первом входе</span>
        </label>
        <button type="submit" class="btn primary" id="cBtn">Создать</button>
      </form>
    </div>

    <div class="card">
      <h2>Учётные записи</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col">ФИО</th>
              <th scope="col">Логин</th>
              <th scope="col">Роль</th>
              <th scope="col">Статус</th>
              <th scope="col">Создана</th>
              <th scope="col"><span class="visually-hidden">Действия</span></th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr><td colspan="6" class="empty">Загрузка…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<div class="modal-backdrop" id="resetModal">
  <form class="modal" id="resetForm" role="dialog" aria-modal="true" aria-labelledby="resetDialogTitle">
    <h3 id="resetDialogTitle">Сброс пароля: <span id="resetName"></span></h3>
    <div class="field">
      <label for="rPass">Новый пароль</label>
      <input id="rPass" type="password" required minlength="8" autocomplete="new-password" />
    </div>
    <label class="checkbox">
      <input type="checkbox" id="rMustReset" checked />
      <span>Сброс пароля при первом входе</span>
    </label>
    <div class="modal-actions">
      <button type="button" class="btn" id="rCancel">Отмена</button>
      <button type="submit" class="btn primary">Сохранить</button>
    </div>
  </form>
</div>

<div class="toast-host" id="toastHost" aria-live="polite"></div>

<script src="/config.js"></script>
<script src="/auth.js"></script>
<script src="/common.js"></script>
<script>
'use strict';
const $ = NMUI.$;
const esc = NMUI.escapeHTML;
const toast = NMUI.toast;
const fmtDate = NMUI.fmtDate;

let me = null;
let resetTarget = null;

async function api(method, url, body) {
  const opts = { method, credentials: 'same-origin', headers: NMAuth.nmAuthHeaders() };
  if (body !== undefined) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(url, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
  return data;
}

function render(users) {
  const tb = $('tbody');
  if (!users.length) {
    tb.innerHTML = '<tr><td colspan="6" class="empty">Нет пользователей</td></tr>';
    return;
  }
  tb.innerHTML = users.map(u => {
    const isSelf = me && me.username && me.username.toLowerCase() === u.username.toLowerCase();
    const resetBadge = u.must_reset_password
      ? '<span class="badge reset">сброс при входе</span>'
      : '<span class="badge">ок</span>';
    return `<tr>
      <td>
        <input class="fio-input" data-fio="${esc(u.username)}" value="${esc(u.full_name || '')}"
          maxlength="200" placeholder="ФИО" />
      </td>
      <td><b>${esc(u.username)}</b>${isSelf ? ' <span class="badge">вы</span>' : ''}</td>
      <td>
        <select data-role="${esc(u.username)}" ${isSelf ? 'disabled' : ''}>
          <option value="operator" ${u.role === 'operator' ? 'selected' : ''}>Оператор</option>
          <option value="administrator" ${u.role === 'administrator' ? 'selected' : ''}>Администратор</option>
        </select>
      </td>
      <td>${resetBadge}</td>
      <td>${esc(fmtDate(u.created_at))}</td>
      <td class="actions">
        <button class="btn" data-reset="${esc(u.username)}">Сбросить пароль</button>
        <button class="btn danger" data-del="${esc(u.username)}" ${isSelf ? 'disabled' : ''}>Удалить</button>
      </td>
    </tr>`;
  }).join('');

  tb.querySelectorAll('input[data-fio]').forEach(inp => {
    let last = inp.value;
    const save = async () => {
      if (inp.value === last) return;
      try {
        await api('POST', '/api/users/' + encodeURIComponent(inp.dataset.fio) + '/full-name', {
          full_name: inp.value,
        });
        last = inp.value;
        toast('ФИО сохранено', 'success');
        if (me && me.username && me.username.toLowerCase() === inp.dataset.fio.toLowerCase()) {
          me.full_name = inp.value.trim();
          NMAuth.renderUserBar(me, $('userBarHost'));
        }
      } catch (e) {
        toast(e.message, 'error');
        inp.value = last;
      }
    };
    inp.addEventListener('change', save);
    inp.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter') { ev.preventDefault(); inp.blur(); }
    });
  });

  tb.querySelectorAll('select[data-role]').forEach(sel => {
    sel.addEventListener('change', async () => {
      try {
        await api('POST', '/api/users/' + encodeURIComponent(sel.dataset.role) + '/role', { role: sel.value });
        toast('Роль обновлена', 'success');
        load();
      } catch (e) {
        toast(e.message, 'error');
        load();
      }
    });
  });
  tb.querySelectorAll('[data-reset]').forEach(btn => {
    btn.addEventListener('click', () => openReset(btn.dataset.reset));
  });
  tb.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Удалить пользователя «' + btn.dataset.del + '»?')) return;
      try {
        await api('DELETE', '/api/users/' + encodeURIComponent(btn.dataset.del));
        toast('Удалено', 'success');
        load();
      } catch (e) {
        toast(e.message, 'error');
      }
    });
  });
}

async function load() {
  try {
    const data = await api('GET', '/api/users');
    render(data.users || []);
  } catch (e) {
    $('tbody').innerHTML = '<tr><td colspan="6" class="empty">Ошибка: ' + esc(e.message) + '</td></tr>';
  }
}

function closeReset() {
  $('resetModal').classList.remove('show');
  resetTarget = null;
}

function openReset(username) {
  resetTarget = username;
  $('resetName').textContent = username;
  $('rPass').value = '';
  $('rMustReset').checked = true;
  $('resetModal').classList.add('show');
  $('rPass').focus();
}

$('rCancel').addEventListener('click', closeReset);
$('resetModal').addEventListener('click', (e) => {
  if (e.target === $('resetModal')) closeReset();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && $('resetModal').classList.contains('show')) {
    e.preventDefault();
    closeReset();
  }
});

$('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!resetTarget) return;
  try {
    await api('POST', '/api/users/' + encodeURIComponent(resetTarget) + '/reset-password', {
      password: $('rPass').value,
      must_reset_password: $('rMustReset').checked,
    });
    toast('Пароль сброшен', 'success');
    closeReset();
    load();
  } catch (err) {
    toast(err.message, 'error');
  }
});

$('createForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('cBtn').disabled = true;
  try {
    await api('POST', '/api/users', {
      username: $('cUser').value.trim(),
      full_name: $('cFio').value.trim(),
      password: $('cPass').value,
      role: $('cRole').value,
      must_reset_password: $('cMustReset').checked,
    });
    toast('Пользователь создан', 'success');
    $('cUser').value = '';
    $('cFio').value = '';
    $('cPass').value = '';
    $('cMustReset').checked = true;
    load();
  } catch (err) {
    toast(err.message, 'error');
  } finally {
    $('cBtn').disabled = false;
  }
});

(async function boot() {
  const bar = NMUI.mountAdminTopbar('#adminTopbar', {
    title: 'Пользователи',
    subtitle: 'локальные учётные записи',
  });
  me = await NMAuth.requireLogin({ admin: true });
  if (!me) return;
  NMAuth.renderUserBar(me, bar.userBarHost);
  NMUI.startSystemHealthPolling({ isAdmin: true });
  load();
})();
</script>
</body>
</html>
