version: "2"

linters:
  enable:
    - bodyclose
    - contextcheck
    - gosec
  settings:
    gosec:
      excludes:
        - G104 # audited via errcheck
        - G304 # paths often from env/config
        - G115 # int conversions in metrics/limits
        - G124 # Secure set via cookieSecure(r); CSRF cookie must be JS-readable
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - bodyclose
