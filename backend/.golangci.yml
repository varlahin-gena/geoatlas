version: "2"

linters:
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - errorlint
    - gosec
    - nilerr
    - perfsprint
    - prealloc
    - unused
  settings:
    gosec:
      excludes:
        - G104 # audited via errcheck
        - G304 # paths often from env/config
        - G115 # int conversions in metrics/limits
        - G124 # Secure follows TLS/X-Forwarded-Proto; CSRF cookie must be JS-readable
    perfsprint:
      # fmt.Errorf("static") → errors.New is style, not a hot-path win.
      error-format: false
      errorf: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - bodyclose
          - prealloc
          - perfsprint

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - geoatlas
