        Ставит в очередь async job (до 6 ч): `BackfillEdgesAgg` → `BackfillGeoEdgesAgg` →
        EnrichLogsMissingGeo при наличии GeoIP.
        Прогресс — `GET /api/system/edges-agg`. HTTP 202 Accepted.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "202":
          description: Job scheduled
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  scheduled: { type: boolean }
                  job: { type: string }
                  status: { type: string }
        "503":
          description: Scheduler unavailable

  /api/system/install-profile:
    get:
      tags: [system]
      summary: Профиль установки (EPS limits)
      description: Только administrator или Bearer.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Install profile JSON

  /api/system/retention:
    get:
      tags: [system]
      summary: Срок хранения (TTL) таблиц ClickHouse
      description: |
        Только administrator или Bearer.
        Значения из `/app/data/retention.json` или дефолты (30/30/7/7 дней).
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Текущие настройки retention
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  retention:
                    $ref: '#/components/schemas/RetentionSettings'
    put:
      tags: [system]
      summary: Обновить TTL таблиц ClickHouse
      description: |
        Только administrator или Bearer (+ CSRF для cookie-сессии).
        Сохраняет JSON и выполняет ALTER TABLE MODIFY TTL.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: X-CSRF-Token
          in: header
          required: false
          schema: { type: string }
          description: Обязателен для cookie-сессии (см. ga_csrf)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetentionSettings'
      responses:
        "200":
          description: Применённые настройки
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  retention:
                    $ref: '#/components/schemas/RetentionSettings'
        "400":
          description: Невалидные дни (нужно 1…730)

  /api/system/tls:
    get:
      tags: [system]
      summary: Статус HTTPS-сертификатов
      description: |
        Только administrator или Bearer.
        Читает PEM из каталога `certs/` (TLS_CERT_DIR в backend).
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Статус TLS и метаданные сертификата
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TlsStatusResponse"
    put:
      tags: [system]
      summary: Загрузить HTTPS-сертификат и ключ
      description: |
        Только administrator или Bearer (+ CSRF для cookie-сессии).
        Сохраняет `fullchain.pem` и `privkey.pem` на диск.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: X-CSRF-Token
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cert_pem, key_pem]
              properties:
                cert_pem: { type: string }
                key_pem: { type: string }
      responses:
        "200":
          description: Сертификаты сохранены
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TlsMutationResponse"
        "400":
          description: Невалидный PEM или несовпадение ключа

  /api/system/tls/reload:
    post:
      tags: [system]
      summary: Применить сертификаты (reload nginx)
      description: |
        Только administrator или Bearer (+ CSRF).
        Выполняет GA_TLS_RELOAD_CMD, если задан, иначе возвращает подсказку о перезапуске frontend.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: X-CSRF-Token
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Результат применения
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TlsMutationResponse"

  /api/system/backups:
    get:
      tags: [system]
      summary: Список бэкапов ClickHouse
      description: |
