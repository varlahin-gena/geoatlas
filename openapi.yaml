    post:
      tags: [geo]
      summary: Отметить диапазон как сеть предприятия
      description: |
        administrator или Bearer (ops). `network` — CIDR, диапазон a-b или одиночный IPv4.
        Пометки живут в таблице `enterprise_nets` и не сбрасываются при заливке GeoIP CSV.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [network]
              properties:
                network: { type: string, example: "10.20.0.0/16" }
                label: { type: string }
                country: { type: string }
                region: { type: string }
                city: { type: string }
      responses:
        "200":
          description: net added
          content:
            application/json:
              schema:
                type: object
                properties:
                  item:
                    $ref: "#/components/schemas/EnterpriseNet"
        "400":
          description: validation
        "401":
          description: unauthorized
        "403":
          description: forbidden

  /api/enterprise-nets/{start_ip}/{end_ip}:
