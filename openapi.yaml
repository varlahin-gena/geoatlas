        "403":
          description: forbidden

  /api/ingest/stats:
    get:
      tags: [ingest]
      summary: Live-ingest counters
      description: |
        administrator или Bearer (ops).
        Ключевые поля: `dropped_total` (queue admission), `buffer_drops_total`
        (processor buffer при CH outage), `circuit_open` (dequeue paused).
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Stats snapshot
        "401":
          description: unauthorized
        "403":
          description: forbidden (например operator)

  /api/ingest:
    post:
      tags: [ingest]
      summary: Загрузить сырые строки логов (text/plain)
      description: |
        administrator или Bearer (ops). Сессия operator — 403.
        Строки ставятся в ту же очередь, что syslog TCP.

        **Delivery contract (at-most-once / best-effort):** при переполнении
        очередь **не блокируется**: дропнутые строки → HTTP **503** + `Retry-After`
        и `stats.dropped` (не маскируется под 200). Клиент должен backoff/retry.
        При outage ClickHouse insert circuit **ставит dequeue на паузу** (очередь
        растёт → дальнейшие enqueue дают 503); потери processor-буфера видны в
        `buffer_drops_total` на `GET /api/ingest/stats`. Durable spool в backend
        нет — для audit-grade доставки полагайтесь на disk-буфер syslog-ng.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          text/plain:
            schema: { type: string }
      responses:
        "200":
          description: все строки приняты в очередь (dropped=0)
        "503":
          description: очередь полна — часть/все строки дропнуты; смотри stats + Retry-After
        "401":
          description: unauthorized

  /upload-logs:
    post:
      tags: [ingest]
      summary: Upload логов (multipart file или raw body)
      description: |
        administrator или Bearer (ops). Сессия operator — 403.
        Тот же delivery contract, что `POST /api/ingest` (503 при drops).
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: все строки приняты в очередь (dropped=0)
        "503":
          description: очередь полна — часть/все строки дропнуты; смотри stats + Retry-After
        "401":
          description: unauthorized

  /upload-geo:
    post:
      tags: [geo]
      summary: Импорт GeoIP CSV
      description: |
        administrator или Bearer (ops). Сессия operator — 403.
        `?dry_run=1` — только валидация CSV (ReadCSV), без записи в ClickHouse и без reload.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: dry_run
          in: query
          required: false
          schema:
            type: string
            enum: ["1", "true", "yes", "on"]
          description: Validate CSV only; do not truncate/insert geo_ranges
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: ranges imported (or dry_run validation ok)
        "400":
          description: invalid CSV
        "401":
          description: unauthorized

  /upload-reputation:
    post:
      tags: [reputation]
      summary: Импорт репутационных списков CSV
      description: |
        administrator или Bearer (ops). Сессия operator — 403.
        CSV: `Network,List,Category`. `?dry_run=1` — только валидация.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: dry_run
          in: query
          required: false
          schema:
            type: string
            enum: ["1", "true", "yes", "on"]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
          text/csv:
            schema: { type: string }
      responses:
        "200":
          description: ranges imported (or dry_run ok)
        "400":
          description: invalid CSV
        "401":
          description: unauthorized

  /api/reputation/lists:
