        Каталог на томе `clickhouse-backups` + статус фоновой задачи.
        У каждой записи `source`: `manual` | `schedule` (пусто у старых бэкапов без маркера).
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Каталог бэкапов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupCatalog"
    post:
      tags: [system]
      summary: Запустить создание бэкапа
      description: |
        Только administrator или Bearer (+ CSRF для cookie-сессии).
        Асинхронно: native `BACKUP TABLE … TO Disk('backups', …)`.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: X-CSRF-Token
          in: header
          required: false
          schema: { type: string }
      responses:
        "202":
          description: Задача поставлена в очередь
        "409":
          description: Уже выполняется другой бэкап
        "503":
          description: Сервис/каталог недоступен

  /api/system/backups/{name}/attach:
    post:
      tags: [system]
      summary: Подключить бэкап (данные → живые таблицы)
      description: |
        Только administrator. Асинхронно: RESTORE map-таблиц в shadow `ga_bak_*`
        (live и ingest не трогаются). На карте переключатель Live / Бэкап.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: X-CSRF-Token
          in: header
          required: false
          schema: { type: string }
      responses:
        "202":
          description: Задача поставлена
        "404":
          description: Бэкап не найден
        "409":
          description: Уже выполняется другая операция

  /api/system/backups/{name}/detach:
    post:
      tags: [system]
      summary: Отключить подключённый бэкап (очистить таблицы)
      description: |
        Только administrator. DROP shadow `ga_bak_*`; файлы бэкапа и live остаются.
        Доступно только для текущего attached бэкапа.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: X-CSRF-Token
          in: header
          required: false
          schema: { type: string }
      responses:
        "202":
          description: Задача поставлена
        "400":
          description: Бэкап не подключён
        "409":
          description: Уже выполняется другая операция

  /api/system/backups/{name}:
    delete:
      tags: [system]
      summary: Удалить бэкап с тома
      description: |
        Только administrator. Нельзя удалить подключённый бэкап — сначала detach.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: X-CSRF-Token
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Удалён
        "404":
          description: Не найден
        "409":
          description: Подключён или занят job

  /api/system/backup-schedule:
    get:
      tags: [system]
      summary: Расписание и политика автобэкапов
      description: |
        Только administrator. Файл `/app/data/backup_schedule.json` (BACKUP_SCHEDULE_FILE).
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Текущее расписание
    put:
      tags: [system]
      summary: Обновить расписание автобэкапов
      description: |
        Только administrator (+ CSRF). Ежедневно в hour:minute timezone; keep 1…90;
        include_edges / include_auth. BACKUP_ENABLED=0 запрещает создание.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: X-CSRF-Token
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                hour: { type: integer, minimum: 0, maximum: 23 }
                minute: { type: integer, minimum: 0, maximum: 59 }
                timezone: { type: string, example: Europe/Moscow }
                keep: { type: integer, minimum: 1, maximum: 90 }
                include_edges: { type: boolean }
                include_auth: { type: boolean }
      responses:
        "200":
          description: Сохранено
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  schedule:
                    $ref: "#/components/schemas/BackupSchedule"
        "400":
          description: Невалидные поля

  /api/dr/history:
    get:
      tags: [system]
      summary: DR-history backup и restore операций
      description: |
        Только administrator или Bearer. Возвращает append-only журнал backup.create,
        backup.attach, backup.detach, backup.delete и backup.schedule.update.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, default: 100, maximum: 200 }
        - name: action
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: actor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: История DR-операций
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DRHistoryList'

  /api/audit:
    get:
      tags: [system]
      summary: Audit log admin/security действий
      description: |
        Только administrator или Bearer. Возвращает append-only журнал login/users/tokens/
        retention/backup действий.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, default: 100, maximum: 200 }
        - name: action
          in: query
          schema: { type: string }
        - name: result
          in: query
          schema: { type: string }
        - name: actor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Audit log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogList'

  /api/parse-errors:
    get:
      tags: [parse]
      summary: Последние ошибки парсинга
      description: Только administrator или Bearer.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 500, maximum: 5000 }
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Parse errors list

  /api/parse-errors/delete:
    post:
      tags: [parse]
      summary: Удалить parse_errors
      description: Только administrator или Bearer.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items: { type: string }
                all:
                  type: boolean
      responses:
        "200":
          description: deleted
        "401":
          description: unauthorized

  /api/parse-samples:
    get:
      tags: [parse]
      summary: Встроенные сэмплы парсеров
      description: Только administrator или Bearer.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Sample parse results

  /api/parse-test:
    post:
      tags: [parse]
      summary: Прогон произвольных строк через парсеры
      description: Только administrator или Bearer.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          text/plain:
            schema: { type: string }
      responses:
        "200":
          description: Parse results

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API_AUTH_TOKEN (мутации, admin/ops API)
    cookieAuth:
      type: apiKey
      in: cookie
      name: ga_session
      description: Сессия после POST /api/auth/login

  schemas:
    RetentionSettings:
      type: object
      required: [traffic_logs_days, edges_days, parse_errors_days, system_metrics_days]
      properties:
        traffic_logs_days:
          type: integer
          minimum: 1
          maximum: 730
          description: TTL для traffic_logs (дни)
        edges_days:
          type: integer
          minimum: 1
          maximum: 730
          description: TTL для traffic_edges_* агрегатов (дни)
        parse_errors_days:
          type: integer
          minimum: 1
          maximum: 730
          description: TTL для parse_errors (дни)
        system_metrics_days:
          type: integer
          minimum: 1
          maximum: 730
          description: TTL для system_metrics (дни)
        updated_at:
          type: string
          format: date-time
          description: Время последнего сохранения (UTC)

    LiveResponse:
      type: object
      required: [ok, status]
      properties:
        ok: { type: boolean }
        status:
          type: string
          enum: [live]
      description: Liveness. HTTP 200, если процесс отвечает.

    HealthResponse:
      type: object
      properties:
        ok: { type: boolean }
        status:
          type: string
          enum: [healthy, degraded, overloaded, unavailable]
          description: >
            healthy — норма; degraded — очередь ≥75% или есть drops;
            overloaded — очередь ≥90%, drops/s ≥100 или ingest error;
            unavailable — ClickHouse недоступен (HTTP 503).
        clickhouse: { type: string }
        error: { type: string }
        ingest:
          type: object
          additionalProperties: true
          description: Краткий снимок очереди/drops (если live ingest включён)
      description: >
        Readiness (`GET /ready`). HTTP 503 только если ClickHouse недоступен.
        Перегрузка ingest отражается в status при HTTP 200.
        Детали — /api/ingest/stats и /api/system/stats.

    EventsResponse:
      type: object
      description: |
        Payload карты (/api/events). Схемы MapLine / MapPoint / ReputationHit —
        источник frontend/src/api/openapi.d.ts (mapTypes.ts алиасит их) и
        backend/internal/model Line / Node.
      properties:
        group_by: { type: string }
        filter: { type: string }
        country: { type: string }
        q: { type: string }
        period: { type: string }
        days: { type: integer }
        hours: { type: integer }
        minutes: { type: integer }
        from: { type: string }
        to: { type: string }
        data_source: { type: string, enum: [live, backup] }
        backup_attached: { type: string }
        lines:
          type: array
          items:
            $ref: "#/components/schemas/MapLine"
        points:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/MapPoint"
        stats:
          type: object
          properties:
            raw_pairs: { type: integer }
            edges: { type: integer }
            nodes: { type: integer }
            skipped_no_geo: { type: integer }
            source:
              type: string
              description: "ip | geo_city | geo_country"
              example: geo_city
        reputation_facets:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
          description: Категория → списки (до фильтра репутации), для меню на карте.

    AnomalyMapLink:
      type: object
      properties:
        period: { type: string }
        group: { type: string }
        filter: { type: string }
        q: { type: string }
        country: { type: string }

    AnomalyEvent:
      type: object
      properties:
        fingerprint: { type: string }
        code: { type: string }
        code_label: { type: string }
        severity: { type: string, enum: [info, warn, high] }
        score: { type: number, format: float }
        title: { type: string }
        detail: { type: object, additionalProperties: true }
        src_ip: { type: string }
        dst_ip: { type: string }
        src_country: { type: string }
        dst_country: { type: string }
        src_city: { type: string }
        dst_city: { type: string }
        device: { type: string }
        event_count: { type: integer }
        detected_at: { type: string, format: date-time }
        window_start: { type: string, format: date-time }
        window_end: { type: string, format: date-time }
        acknowledged: { type: boolean }
        assigned_to: { type: string }
        ack_by: { type: string }
        map:
          $ref: "#/components/schemas/AnomalyMapLink"

    AnomalySummary:
      type: object
      properties:
        high: { type: integer }
        warn: { type: integer }
        total: { type: integer }
        acked: { type: integer }
        learning: { type: boolean }
        enabled: { type: boolean }
        updated_at: { type: string, format: date-time }
        enterprise_nets: { type: integer }

    AnomalyList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AnomalyEvent"
        summary:
          $ref: "#/components/schemas/AnomalySummary"

    AnomalyScanStatus:
      type: object
      properties:
        enabled: { type: boolean }
        learning: { type: boolean }
        last_ok: { type: string, format: date-time }
        last_error: { type: string }
        last_duration: { type: string }
        last_inserted: { type: integer }
        last_skip: { type: string }
        enterprise_nets: { type: integer }

    AuthUser:
      type: object
      required: [username, role, reputationEnabled]
      properties:
        username: { type: string }
        full_name: { type: string }
        role:
          type: string
          enum: [administrator, operator, dashboard]
        must_reset_password: { type: boolean }
        geo_wizard_dismissed: { type: boolean }
        authDisabled: { type: boolean }
        reputationEnabled: { type: boolean }

    ReputationHit:
      type: object
      required: [list, category]
      properties:
        list: { type: string }
        category: { type: string }
        network: { type: string }

    SystemAlert:
      type: object
      additionalProperties: true
      properties:
        level: { type: string }
        code: { type: string }
        target: { type: string }
        message: { type: string }

    SystemFailedLogin:
      type: object
      additionalProperties: true
      properties:
        username: { type: string }
        ip: { type: string }
        count: { type: integer }
        first_at: { type: string }
        last_at: { type: string }
        locked: { type: boolean }
        locked_until: { type: string }

    SystemEdgesAgg:
      type: object
      additionalProperties: true
      properties:
        state: { type: string }
        phase: { type: string }
        message: { type: string }
        raw_rows: { type: integer }
        agg_rows: { type: integer }
        days_total: { type: integer }
        days_done: { type: integer }
        map_source: { type: string }
        prefer_agg: { type: boolean }
        geo_prefer_agg: { type: boolean }
        started_at: { type: string }
        updated_at: { type: string }

    SystemBackendInfo:
      type: object
      additionalProperties: true
      properties:
        num_goroutine: { type: integer }
        heap_alloc_mb: { type: number }
        go_version: { type: string }
        geo_index_ranges: { type: integer }
        geo_index_mb: { type: number }

    SystemContainerStats:
      type: object
      additionalProperties: true
      properties:
        cpu_pct: { type: number }
        mem_bytes: { type: number }

    SystemStatus:
      type: object
      additionalProperties: true
      properties:
        level: { type: string }
        alert_count: { type: integer }
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/SystemAlert"

    SystemVersion:
      type: object
      additionalProperties: true
      properties:
        ok: { type: boolean }
        version: { type: string }
        source: { type: string }
        ref: { type: string }
        commit: { type: string }
        display: { type: string }

    SystemStats:
      type: object
      description: Сводка GET /api/system/stats. Дополнительные поля допустимы.
      additionalProperties: true
      properties:
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/SystemAlert"
        uptime_sec: { type: integer }
        timestamp: { type: string }
        ingest_slo:
          type: object
          additionalProperties: true
        pipeline:
          type: object
          additionalProperties: true
        containers:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/SystemContainerStats"
        health:
          type: object
          additionalProperties: true
        storage:
          type: object
          additionalProperties: true
        backend_info:
          $ref: "#/components/schemas/SystemBackendInfo"
        install_profile:
          type: object
          additionalProperties: true
        edges_agg:
          $ref: "#/components/schemas/SystemEdgesAgg"
        failed_logins:
          type: array
          items:
            $ref: "#/components/schemas/SystemFailedLogin"

    DREvent:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        actor: { type: string }
        action: { type: string }
        target: { type: string }
        status: { type: string, enum: [started, succeeded, failed] }
        message: { type: string }
        meta:
          type: object
          additionalProperties: true

    DRHistoryList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DREvent"

    AuditEvent:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        actor: { type: string }
        action: { type: string }
        resource_type: { type: string }
        resource_id: { type: string }
        result: { type: string }
        ip: { type: string }
        details:
          type: object
          additionalProperties: true

    AuditLogList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"

    MapPoint:
      type: object
      required: [lat, lon]
      properties:
        lat: { type: number }
        lon: { type: number }
        country: { type: string }
        city: { type: string }
        region: { type: string }
        label: { type: string }
        count: { type: integer }
        reputation:
          type: array
          items:
            $ref: "#/components/schemas/ReputationHit"

    MapLine:
      type: object
      required: [src, dst]
      properties:
        src: { type: string }
        dst: { type: string }
        src_label: { type: string }
        dst_label: { type: string }
        src_lat: { type: number }
        src_lon: { type: number }
        dst_lat: { type: number }
        dst_lon: { type: number }
        status: { type: string }
        blocked: { type: boolean }
        count: { type: integer }
        allowed_count: { type: integer }
        blocked_count: { type: integer }
        bytes_sent: { type: integer }
        bytes_recv: { type: integer }
        rule: { type: string }
        proto: { type: string }
        src_port: { type: integer }
        dst_port: { type: integer }
        src_zone: { type: string }
        dst_zone: { type: string }
        src_country: { type: string }
        dst_country: { type: string }
        device: { type: string }
        last_action: { type: string }
        src_reputation:
          type: array
          items:
            $ref: "#/components/schemas/ReputationHit"
        dst_reputation:
          type: array
          items:
            $ref: "#/components/schemas/ReputationHit"

    AuthUserPublic:
      type: object
      required: [username, role]
      properties:
        username: { type: string }
        full_name: { type: string }
        role: { type: string, enum: [administrator, operator, dashboard] }
        must_reset_password: { type: boolean }
        created_at: { type: string }

    AuthUserList:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AuthUserPublic"

    ApiToken:
      type: object
      required: [id, name, scope]
      properties:
        id: { type: string }
        name: { type: string }
        scope: { type: string, enum: [read, ops, admin] }
        created_at: { type: string }

    ApiTokenList:
      type: object
      properties:
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/ApiToken"

    ApiTokenCreateResponse:
      type: object
      properties:
        token:
          $ref: "#/components/schemas/ApiToken"
        secret: { type: string }

    EventsSeriesResponse:
      type: object
      properties:
        country: { type: string }
        bucket_sec: { type: integer }
        period: { type: string }
        points:
          type: array
          items:
            type: object
            properties:
              t: { type: string }
              allowed: { type: integer }
              blocked: { type: integer }
              total: { type: integer }

    GeoRange:
      type: object
      properties:
        network: { type: string }
        start_ip: { type: integer }
        end_ip: { type: integer }
        country: { type: string }
        region: { type: string }
        city: { type: string }
        lat: { type: number }
        lon: { type: number }

    GeoRangesResponse:
      type: object
      properties:
        ranges:
          type: array
          items:
            $ref: "#/components/schemas/GeoRange"
        count: { type: integer }
        ip_hit: { type: boolean }
        index_ready: { type: boolean }
        limits:
          type: object
          properties:
            upload_max_bytes: { type: integer }
            upload_max_ranges: { type: integer }

    GeoRangeCreateResponse:
      type: object
      properties:
        ranges: { type: integer }
        added: { type: string }
        entry:
          type: object
          properties:
            network: { type: string }

    GeoMissingRow:
      type: object
      required: [ip]
      properties:
        ip: { type: string }
        kind: { type: string }
        count: { type: integer }
        as_src: { type: integer }
        as_dst: { type: integer }
        sample_peer: { type: string }
        log_country: { type: string }
        log_city: { type: string }
        action_hint: { type: string }
        last_seen: { type: string }

    GeoMissingResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GeoMissingRow"
        summary:
          type: object
          additionalProperties: true

    EnterpriseNet:
      type: object
      properties:
        network: { type: string }
        start_ip: { type: integer }
        end_ip: { type: integer }
        label: { type: string }
        country: { type: string }
        region: { type: string }
        city: { type: string }
        created_at: { type: string }

    EnterpriseNetsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EnterpriseNet"
        count: { type: integer }
        max: { type: integer }

    ReputationFeed:
      type: object
      required: [name]
      properties:
        name: { type: string }
        url: { type: string }
        category: { type: string }
        format: { type: string }
        enabled: { type: boolean }
        last_refresh: { type: string }

    ReputationListMeta:
      type: object
      required: [name]
      properties:
        name: { type: string }
        category: { type: string }
        count: { type: integer }
        source: { type: string }
        updated_at: { type: string }
        last_error: { type: string }

    ReputationRefreshResult:
      type: object
      properties:
        updated:
          type: array
          items: { type: string }
        skipped:
          type: array
          items: { type: string }
        failed:
          type: array
          items: { type: string }
        errors:
          type: object
          additionalProperties: { type: string }
        counts:
          type: object
          additionalProperties: { type: integer }

    SystemHistoryResponse:
      type: object
      properties:
        period: { type: string }
        from: { type: string }
        to: { type: string }
        series:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              required: [t, v]
              properties:
                t: { type: string }
                v: { type: number }

    BackupSchedule:
      type: object
      additionalProperties: true
      properties:
        enabled: { type: boolean }
        hour: { type: integer }
        minute: { type: integer }
        timezone: { type: string }
        keep: { type: integer }
        include_edges: { type: boolean }
        include_auth: { type: boolean }
        updated_at: { type: string }
        last_run_at: { type: string }
        last_run_date: { type: string }

    BackupEntry:
      type: object
      required: [name]
      properties:
        name: { type: string }
        created_at: { type: string }
        size_bytes: { type: integer }
        has_auth: { type: boolean }
        attached: { type: boolean }
        source: { type: string }

    BackupCatalog:
      type: object
      additionalProperties: true
      properties:
        ok: { type: boolean }
        enabled: { type: boolean }
        dir_ready: { type: boolean }
        keep: { type: integer }
        include_edges: { type: boolean }
        include_auth: { type: boolean }
        attached: { type: string }
        schedule:
          $ref: "#/components/schemas/BackupSchedule"
        next_run_at: { type: string }
        backups:
          type: array
          items:
            $ref: "#/components/schemas/BackupEntry"
        status:
          type: object
          additionalProperties: true
        hint: { type: string }

    TlsCertInfo:
      type: object
      additionalProperties: true
      properties:
        subject: { type: string }
        issuer: { type: string }
        not_before: { type: string }
        not_after: { type: string }
        days_left: { type: integer }
        sans:
          type: array
          items: { type: string }
        fingerprint_sha256: { type: string }
        self_signed: { type: boolean }

    TlsStatus:
      type: object
      additionalProperties: true
      properties:
        configured: { type: boolean }
        writable: { type: boolean }
        cert_present: { type: boolean }
        key_present: { type: boolean }
        https_enabled: { type: string }
        https_port: { type: string }
        http_redirect: { type: string }
        cert_path: { type: string }
        key_path: { type: string }
        cert:
          $ref: "#/components/schemas/TlsCertInfo"

    TlsStatusResponse:
      allOf:
        - $ref: "#/components/schemas/TlsStatus"
        - type: object
          properties:
            tls:
              $ref: "#/components/schemas/TlsStatus"

    TlsMutationResponse:
      type: object
      properties:
        ok: { type: boolean }
        reload:
          type: object
          properties:
            reloaded: { type: boolean }
            restart_required: { type: boolean }
            message: { type: string }

    AnomalyAckResponse:
      type: object
      properties:
        ok: { type: boolean }
        fingerprint: { type: string }
        ack_by: { type: string }

    AnomalyAssignResponse:
      type: object
      properties:
        ok: { type: boolean }
        fingerprint: { type: string }
        assigned_to: { type: string }
