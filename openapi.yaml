      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Edges agg status (state, phase, prefer_agg, map_source)

  /api/system/maintenance/backfill:
    post:
      tags: [system]
      summary: Запустить edges/geo-edges backfill (+ geo enrich)
      description: |
