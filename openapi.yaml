openapi: 3.0.3
info:
  title: ГеоАтлас API
  version: "1.15.0"
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  description: |
    Backend API для приёма syslog/логов МСЭ, GeoIP и карты трафика.

    Локальная авторизация (cookie `ga_session` после `POST /api/auth/login`):
    - **administrator** — полный доступ (карта, загрузки, система, парсеры, УЗ, API-токены);
    - **operator** — карта (`GET /api/events`) и аномалии (`GET /api/anomalies*`); без загрузок, мониторинга и парсеров.
    - **dashboard** — как operator (карта и аномалии); сессия не протухает по TTL (для видеостены).
    - Cookie содержит `session_version`; смена пароля / `logout-all` / admin reset инвалидируют
      все ранее выданные сессии пользователя.

    Bearer:
    - env `API_AUTH_TOKEN` (+ опционально `API_AUTH_PREVIOUS_TOKEN`) — всегда scope **admin**;
    - именованные токены (`/api/tokens`, файл `API_TOKENS_FILE`): scopes **read** | **ops** | **admin**
      (admin ⊃ ops ⊃ read).

    Уровни доступа (backend middleware):
    - **public** — `/live`, `/api/live`, `/ready`, `/api/ready`, `/health`, `/api/health`, login/logout/logout-all/me/change-password/check*;
    - **login** — любой залогиненный или Bearer≥read (`GET /api/events`);
    - **admin** — роль administrator ИЛИ Bearer scope=admin
      (system/*, parse-*, управление УЗ/токенами);
    - **ops** — administrator или Bearer≥ops для мутаций и pipeline (`POST /api/ingest`,
      `/upload-logs`, `/upload-geo`, `/upload-reputation`, `GET /api/ingest/stats`, `GET /metrics`).
      При `AUTH_DISABLED=1` / `API_AUTH_DISABLED=1` ops открыты; старт только с `GA_ALLOW_INSECURE=1`.

servers:
  - url: /
    description: Через frontend nginx или напрямую backend :8080

tags:
  - name: health
  - name: auth
  - name: events
  - name: anomalies
  - name: ingest
  - name: system
  - name: parse
  - name: geo
  - name: reputation

paths:
  /api/auth/login:
    post:
      tags: [auth]
      summary: Вход (логин/пароль → cookie ga_session)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Неверные учётные данные
  /api/auth/logout:
    post:
      tags: [auth]
      summary: Выход (очищает cookie)
      responses:
        "200":
          description: OK
  /api/auth/logout-all:
    post:
      tags: [auth]
      summary: Revoke всех сессий текущего пользователя (bump session_version) + clear cookie
      description: |
        Инвалидирует все cookie с прежним `session_version`. Требует валидную сессию и CSRF.
      responses:
        "200":
          description: OK
        "401":
          description: Нет сессии
  /api/auth/me:
    get:
      tags: [auth]
      summary: Текущий пользователь
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Нет сессии
  /api/auth/change-password:
    post:
      tags: [auth]
      summary: Смена своего пароля (revoke старых сессий, выдаёт новый cookie)
      description: |
        Bump `session_version` и перевыпускает `ga_session` для текущего браузера.
        Остальные сессии того же пользователя перестают быть валидными.
      responses:
        "200":
          description: OK
        "401":
          description: Неверный текущий пароль / нет сессии
  /api/auth/geo-wizard-dismiss:
    post:
      tags: [auth]
      summary: Скрыть или снова показать first-run GeoIP wizard
      description: |
        Любой залогиненный пользователь. Флаг хранится в `users.json` (`geo_wizard_dismissed`).
        При `AUTH_DISABLED` отвечает ok без персистентности.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dismissed]
              properties:
                dismissed: { type: boolean }
      responses:
        "200":
          description: OK (обновлённый пользователь)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Неверный JSON
        "401":
          description: Нет сессии
  /api/auth/check:
    get:
      tags: [auth]
      summary: nginx auth_request — любой залогиненный или Bearer
      responses:
        "200":
          description: OK
        "401":
          description: Нет сессии
  /api/auth/check-admin:
    get:
      tags: [auth]
      summary: nginx auth_request — administrator / Bearer admin / API_AUTH_DISABLED
      responses:
        "200":
          description: OK
        "401":
          description: Нет сессии
        "403":
          description: Не администратор
  /api/auth/check-ops:
    get:
      tags: [auth]
      summary: nginx auth_request — Bearer≥ops / administrator / API_AUTH_DISABLED
      responses:
        "200":
          description: OK
        "401":
          description: Нет сессии / нет Bearer
        "403":
          description: Недостаточно прав (operator без Bearer ops)
  /api/users:
    get:
      tags: [auth]
      summary: Список локальных УЗ (администратор)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserList"
    post:
      tags: [auth]
      summary: Создать УЗ (обязательно must_reset_password)
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserPublic"
  /api/users/directory:
    get:
      tags: [auth]
      summary: Краткий список УЗ для назначения алертов
      description: Любой залогиненный пользователь. Только username и full_name.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      required: [username]
                      properties:
                        username: { type: string }
                        full_name: { type: string }
  /api/users/{username}/role:
    post:
      tags: [auth]
      summary: Назначить роль
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
  /api/users/{username}/full-name:
    post:
      tags: [auth]
      summary: Обновить ФИО
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
  /api/users/{username}/reset-password:
    post:
      tags: [auth]
      summary: Сброс пароля (обязательно must_reset_password)
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
  /api/users/{username}:
    delete:
      tags: [auth]
      summary: Удалить УЗ
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
  /api/me/search-templates:
    get:
      tags: [auth]
      summary: Личные шаблоны поиска текущего пользователя
      responses:
        "200":
          description: OK
        "401":
          description: Нет сессии
    post:
      tags: [auth]
      summary: Создать личный шаблон поиска
      responses:
        "201":
          description: Created
        "401":
          description: Нет сессии
  /api/me/search-templates/{id}:
    put:
      tags: [auth]
      summary: Обновить личный шаблон поиска
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
        "404":
          description: Не найден
    delete:
      tags: [auth]
      summary: Удалить личный шаблон поиска
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
        "404":
          description: Не найден
  /api/search-templates:
    get:
      tags: [auth]
      summary: Все шаблоны поиска (администратор) с автором
      responses:
        "200":
          description: OK
        "403":
          description: Не администратор
  /api/tokens:
    get:
      tags: [auth]
      summary: Список именованных API-токенов (без секретов)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiTokenList"
    post:
      tags: [auth]
      summary: Создать токен (secret возвращается один раз)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scope]
              properties:
                name: { type: string }
                scope: { type: string, enum: [read, ops, admin] }
      responses:
        "201":
          description: Created (token metadata + secret)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiTokenCreateResponse"
  /api/tokens/{id}:
    delete:
      tags: [auth]
      summary: Отозвать токен
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK

  /live:
    get:
      tags: [health]
      summary: Liveness
      description: |
        Процесс жив. Без ClickHouse и ingest. HTTP 200, если HTTP-сервер отвечает.
        Docker healthcheck backend бьёт сюда.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveResponse"

  /api/live:
    get:
      tags: [health]
      summary: Alias /live
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveResponse"

  /ready:
    get:
      tags: [health]
      summary: Readiness
      description: |
        ClickHouse ping + краткий снимок ingest. HTTP 503 только если ClickHouse
        недоступен. Перегрузка ingest — status при HTTP 200 (`degraded` / `overloaded`).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: ClickHouse недоступен

  /api/ready:
    get:
      tags: [health]
      summary: Alias /ready
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: ClickHouse недоступен

  /health:
    get:
      tags: [health]
      summary: Alias /live
      description: |
        Исторический путь docker/k8s liveness. Эквивалент `/live`.
        Готовность стека (ClickHouse) — `GET /ready`.
        На frontend nginx `GET /health` отвечает локально (без прокси на backend).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveResponse"

  /metrics:
    get:
      tags: [health]
      summary: Prometheus metrics
      description: |
        Text exposition format. Требует Bearer≥ops или administrator session
        (как `GET /api/ingest/stats`). Метрики: HTTP latency by route, ingest queue/drops/circuit,
        insert batch latency, Go/process collectors.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Prometheus text format
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "503":
          description: Metrics registry not wired

  /api/health:
    get:
      tags: [health]
      summary: Alias /live
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveResponse"

  /api/events:
    get:
      tags: [events]
      summary: Карта рёбер/узлов трафика
      description: Требует сессию (administrator или operator) или Bearer API-токен.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 30, default: 1 }
        - name: hours
          in: query
          schema: { type: integer, minimum: 1 }
        - name: minutes
          in: query
          schema: { type: integer, minimum: 1 }
        - name: from
          in: query
          description: RFC3339 или YYYY-MM-DD
          schema: { type: string }
        - name: to
          in: query
          schema: { type: string }
        - name: group_by
          in: query
          schema:
            type: string
            enum: [ip, subnet, city, country]
            default: city
        - name: filter
          in: query
          schema:
            type: string
            enum: [all, allowed, blocked]
            default: all
        - name: limit
          in: query
          description: Макс. сырых пар (по умолчанию 10000, макс. 50000). UI шлёт maxArcs.
          schema: { type: integer, minimum: 1, maximum: 50000, default: 10000 }
        - name: country
          in: query
          description: |
            Точное имя страны (как в traffic_logs / src_country).
            Рёбра, где src или dst совпадает; LIMIT применяется после фильтра.
          schema: { type: string, maxLength: 80 }
        - name: q
          in: query
          description: |
            Поисковая строка карты (простой substring или query-builder AST:
            field:value, AND/OR/NOT, скобки). Применяется в SQL до LIMIT.
            Невалидный AST игнорируется (как в UI).
          schema: { type: string, maxLength: 400 }
        - name: rep_cat
          in: query
          description: |
            Фильтр репутации по категориям (CSV). Только group_by=ip; LIMIT
            применяется после обогащения. Меню фасетов — reputation_facets.
          schema: { type: string }
        - name: rep_list
          in: query
          description: Фильтр репутации по именам списков (CSV). Только group_by=ip.
          schema: { type: string }
        - name: rep_side
          in: query
          schema:
            type: string
            enum: [any, src, dst, both]
            default: any
      responses:
        "200":
          description: lines + points
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventsResponse"
        "400":
          description: Невалидный диапазон времени

  /api/events/series:
    get:
      tags: [events]
      summary: Временной ряд по стране (sparkline)
      description: |
        Allowed/blocked counts по интервалам для src_country или dst_country.
        Требует сессию или Bearer≥read.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: country
          in: query
          required: true
          schema: { type: string }
          description: Имя страны как в traffic_logs (например Russia)
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 30 }
        - name: hours
          in: query
          schema: { type: integer, minimum: 1 }
        - name: minutes
          in: query
          schema: { type: integer, minimum: 1 }
        - name: from
          in: query
          schema: { type: string }
        - name: to
          in: query
          schema: { type: string }
      responses:
        "200":
          description: points [{t, allowed, blocked, total}] + bucket_sec
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventsSeriesResponse"
        "400":
          description: Нет country или невалидный диапазон

  /api/anomalies:
    get:
      tags: [anomalies]
      summary: Журнал аномалий карты
      description: |
        Детерминированные детекторы (port_scan, horizontal_scan, blocked_surge,
        new_country_dst, rep_new_peer). Сессия или Bearer≥read. По умолчанию — незакрытые
        за 24 часа.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: severity
          in: query
          schema: { type: string, enum: [warn, high, info] }
        - name: code
          in: query
          schema: { type: string }
        - name: include_acked
          in: query
          schema: { type: string, enum: ["0", "1", "true", "false"] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: items + summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnomalyList"

  /api/anomalies/summary:
    get:
      tags: [anomalies]
      summary: Сводка аномалий для badge на карте
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnomalySummary"

  /api/anomalies/status:
    get:
      tags: [anomalies]
      summary: Состояние сканера аномалий
      description: administrator или Bearer≥ops
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: scanner status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnomalyScanStatus"

  /api/anomalies/{fingerprint}/ack:
    post:
      tags: [anomalies]
      summary: Скрыть аномалию (acknowledge)
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: fingerprint
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnomalyAckResponse"
        "400":
          description: Невалидный fingerprint
        "503":
          description: Модуль выключен

  /api/anomalies/{fingerprint}/assign:
    post:
      tags: [anomalies]
      summary: Назначить аномалию на учётную запись
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: fingerprint
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assigned_to]
              properties:
                assigned_to: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnomalyAssignResponse"
        "400":
          description: Невалидный запрос
        "503":
          description: Модуль выключен

  /api/geo-missing:
    get:
      tags: [geo]
      summary: IP без координат для карты
      description: |
        Только administrator или Bearer.
        Агрегирует уникальные IP из трафика за период, которые нельзя поставить на карту
        (нет live GeoIP и нет lat/lon в логе). Помогает понять, что добавить в GeoIP CSV.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: hours
          in: query
          schema: { type: integer }
        - name: minutes
          in: query
          schema: { type: integer }
        - name: days
          in: query
          schema: { type: integer }
        - name: from
          in: query
          schema: { type: string }
        - name: to
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 500, maximum: 5000 }
        - name: scan_limit
          in: query
          schema: { type: integer, default: 20000 }
      responses:
        "200":
          description: List of IPs missing geo (items, summary)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoMissingResponse"
        "401":
          description: unauthorized
        "403":
          description: forbidden

  /api/geo-ranges:
    get:
      tags: [geo]
      summary: Список диапазонов GeoIP
      description: |
        Только administrator или Bearer.
        Возвращает текущую таблицу `geo_ranges` (сначала in-memory индекс) в JSON.
        Query: `q` (текстовый поиск), `ip` (найти диапазон, покрывающий IPv4),
        `limit` (по умолчанию 2000, макс. 10000; не применяется при `ip`).
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: Filter by Network / Country / Region / City
        - name: ip
          in: query
          schema: { type: string }
          description: IPv4 — вернуть единственный диапазон, в который попадает адрес
          example: "203.0.113.10"
        - name: limit
          in: query
          schema: { type: integer, default: 2000, maximum: 10000 }
      responses:
        "200":
          description: |
            ranges list; `count` — всего в базе/индексе; `index_ready` — in-memory индекс
            после стартового Reload готов (false пока идёт асинхронная загрузка).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoRangesResponse"
        "401":
          description: unauthorized
        "403":
          description: forbidden
    post:
      tags: [geo]
      summary: Добавить один диапазон в базу GeoIP
      description: |
        administrator или Bearer (ops). Сессия operator — 403.
        Загружает текущие `geo_ranges`, добавляет запись, проверяет отсутствие пересечений,
        затем полностью перезаписывает таблицу, сразу обновляет in-memory индекс и планирует backfill.
        Поля соответствуют шаблону CSV SIEM KUMA (`Network`, `Country`, `Region`, `City`, lat/lon).
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [network, country, region, city, lat, lon]
              properties:
                network:
                  type: string
                  description: "IP, CIDR (a.b.c.d/n) или диапазон (a.b.c.d-e.f.g.h)"
                  example: "203.0.113.10"
                country: { type: string, example: "Россия" }
                region: { type: string, example: "OOO_Company" }
                city: { type: string, example: "Москва" }
                lat: { type: number, minimum: -90, maximum: 90, example: 55.76167 }
                lon: { type: number, minimum: -180, maximum: 180, example: 37.60667 }
      responses:
        "200":
          description: range appended; index applied; backfill scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoRangeCreateResponse"
        "400":
          description: validation error or overlapping range
        "401":
          description: unauthorized
        "403":
          description: forbidden
    put:
      tags: [geo]
      summary: Изменить существующий диапазон GeoIP
      description: |
        administrator или Bearer (ops). Находит запись по `original_network`, заменяет её
        новыми полями (с проверкой пересечений), обновляет индекс и планирует backfill.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [original_network, network, country, region, city, lat, lon]
              properties:
                original_network:
                  type: string
                  description: Текущий Network редактируемой записи
                  example: "203.0.113.10"
                network: { type: string, example: "203.0.113.0/24" }
                country: { type: string }
                region: { type: string }
                city: { type: string }
                lat: { type: number }
                lon: { type: number }
      responses:
        "200":
          description: range updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: string }
        "400":
          description: validation / overlap
        "404":
          description: original range not found
        "401":
          description: unauthorized
        "403":
          description: forbidden

