        `processed_total`, `udp_processed`, `tcp_processed`, `drops_per_sec`);
        `health.syslogng.up` — 1 если scrape успешен. Пустой `SYSLOG_STATS_URL` — scrape выключен.
      security:
        - bearerAuth: []
